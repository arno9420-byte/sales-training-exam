<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跨洋狮 - 新人话术考核</title>
<style>
  :root {
    --primary: #1A3C6D; --primary-light: #2B5797; --accent: #FF6B35;
    --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
    --trust: #3B82F6; --intent: #8B5CF6;
    --bg: #F0F4FA; --card: #FFFFFF; --text: #1F2937; --text-secondary: #6B7280;
    --border: #E5E7EB; --shadow: 0 2px 8px rgba(0,0,0,0.06); --shadow-lg: 0 8px 32px rgba(0,0,0,0.1);
    --radius: 12px; --radius-lg: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height:1.6; min-height:100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  .app-container { max-width:1200px; margin:0 auto; padding:12px; }
  @media(min-width:768px) { .app-container { padding:20px; } }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color:#fff; padding:16px 20px; border-radius:var(--radius-lg); margin-bottom:16px;
    display:flex; justify-content:space-between; align-items:center; box-shadow:var(--shadow-lg);
  }
  @media(min-width:768px) { .header { padding:20px 28px; } }
  .header h1 { font-size:18px; font-weight:700; }
  @media(min-width:768px) { .header h1 { font-size:22px; } }
  .header .subtitle { font-size:12px; opacity:0.85; margin-top:2px; display:none; }
  @media(min-width:768px) { .header .subtitle { display:block; } }
  .header-right { display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .header .badge { background:rgba(255,255,255,0.2); padding:6px 12px; border-radius:20px; font-size:12px; white-space:nowrap; }
  .header .nav-link { color:#fff; text-decoration:none; font-size:13px; opacity:0.8; white-space:nowrap; }
  .header .nav-link:hover { opacity:1; }

  /* Setup */
  .setup-card { background:var(--card); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow); max-width:640px; margin:0 auto; }
  @media(min-width:768px) { .setup-card { padding:32px; } }
  .setup-card h2 { font-size:18px; margin-bottom:20px; color:var(--primary); }
  .form-group { margin-bottom:16px; }
  .form-group label { display:block; font-weight:600; margin-bottom:6px; font-size:14px; }
  .form-group input, .form-group select {
    width:100%; padding:12px 14px; border:2px solid var(--border); border-radius:10px;
    font-size:15px; background:#FAFBFC; font-family:inherit; -webkit-appearance:none;
  }
  .form-group input:focus, .form-group select:focus { outline:none; border-color:var(--primary-light); }
  .scenario-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  @media(max-width:380px) { .scenario-grid { grid-template-columns:1fr; } }
  .scenario-card {
    border:2px solid var(--border); border-radius:var(--radius); padding:14px 10px;
    cursor:pointer; text-align:center; transition:all 0.2s; -webkit-tap-highlight-color:transparent;
  }
  .scenario-card:active { transform:scale(0.97); }
  .scenario-card.selected { border-color:var(--primary); background:#EEF3FB; box-shadow:0 0 0 3px rgba(26,60,109,0.1); }
  .scenario-card .icon { font-size:24px; margin-bottom:4px; }
  .scenario-card .name { font-weight:600; font-size:13px; }
  .scenario-card .desc { font-size:11px; color:var(--text-secondary); margin-top:2px; display:none; }
  @media(min-width:480px) { .scenario-card .desc { display:block; } }

  .btn {
    padding:12px 24px; border:none; border-radius:10px; font-size:15px; font-weight:600;
    cursor:pointer; transition:all 0.2s; font-family:inherit; display:inline-flex; align-items:center;
    gap:6px; justify-content:center; -webkit-tap-highlight-color:transparent;
  }
  .btn:active { transform:scale(0.96); }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-primary:hover { background:var(--primary-light); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-lg { padding:14px 28px; font-size:16px; width:100%; }
  .btn-outline { background:#fff; color:var(--primary); border:2px solid var(--primary); }
  .btn-outline:hover { background:#F0F4FA; }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-danger:hover { background:#DC2626; }
  .btn-sm { padding:6px 14px; font-size:13px; }

  /* Exam Layout */
  .exam-layout { display:none; }
  .exam-layout.active { display:flex; flex-direction:column; gap:12px; min-height:calc(100dvh - 100px); }
  @media(min-width:900px) { .exam-layout.active { display:grid; grid-template-columns:300px 1fr; gap:20px; } }

  /* Sidebar */
  .exam-sidebar {
    background:var(--card); border-radius:var(--radius-lg); padding:16px; box-shadow:var(--shadow);
  }
  @media(min-width:900px) { .exam-sidebar { padding:20px; position:sticky; top:16px; height:fit-content; } }
  @media(max-width:899px) {
    .exam-sidebar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
    .exam-sidebar > * { flex:1; min-width:100px; }
  }

  .metric-row { display:flex; gap:10px; margin-bottom:16px; }
  @media(max-width:899px) { .metric-row { flex:2; min-width:200px; } }
  .metric-box {
    flex:1; background:#F8FAFD; border-radius:10px; padding:12px; text-align:center;
  }
  .metric-box .m-label { font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
  .metric-box .m-value { font-size:24px; font-weight:800; }
  @media(min-width:768px) { .metric-box .m-value { font-size:28px; } }
  .metric-trust .m-value { color:var(--trust); }
  .metric-intent .m-value { color:var(--intent); }
  .metric-box .m-bar { height:4px; background:var(--border); border-radius:2px; margin-top:6px; overflow:hidden; }
  .metric-box .m-fill { height:100%; border-radius:2px; transition:width 0.6s ease; }
  .metric-trust .m-fill { background:var(--trust); }
  .metric-intent .m-fill { background:var(--intent); }
  .metric-box .m-delta { font-size:11px; margin-top:2px; }
  .delta-up { color:var(--success); }
  .delta-down { color:var(--danger); }

  .scenario-info { background:#F8FAFD; border-radius:10px; padding:12px; margin-bottom:12px; }
  @media(max-width:899px) { .scenario-info { flex:2; min-width:180px; } }
  .scenario-info .label { font-size:11px; color:var(--text-secondary); }
  .scenario-info .value { font-weight:600; font-size:13px; margin-top:1px; }
  .scenario-info .customer-type {
    display:inline-block; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:600; margin-top:6px;
  }
  .type-price { background:#FFF3E0; color:#E65100; }
  .type-cognition { background:#E3F2FD; color:#0D47A1; }
  .type-decision { background:#FCE4EC; color:#880E4F; }
  .type-silent { background:#F3E5F5; color:#4A148C; }

  .score-mini { text-align:center; padding:12px 0; border-top:1px solid var(--border); margin-top:12px; }
  @media(max-width:899px) { .score-mini { flex:1; min-width:80px; border-top:none; border-left:1px solid var(--border); padding:0 0 0 12px; margin-top:0; } }
  .score-mini .s-num { font-size:36px; font-weight:800; color:var(--primary); line-height:1; }
  .score-mini .s-label { font-size:11px; color:var(--text-secondary); }

  .stop-btn-row { margin-top:12px; text-align:center; }
  @media(max-width:899px) { .stop-btn-row { flex:1; min-width:100px; display:flex; align-items:center; justify-content:center; } }

  /* Chat */
  .chat-container {
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    display:flex; flex-direction:column; height:calc(100dvh - 200px); min-height:400px;
  }
  @media(min-width:900px) { .chat-container { height:calc(100dvh - 140px); } }
  .chat-header {
    padding:14px 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .chat-header .avatar {
    width:38px; height:38px; border-radius:50%; background:var(--primary-light);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:700; flex-shrink:0;
  }
  .chat-header .info .name { font-weight:600; font-size:14px; }
  .chat-header .info .status { font-size:11px; color:var(--success); }
  .chat-messages {
    flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
    background:#FAFBFC; -webkit-overflow-scrolling:touch;
  }
  @media(min-width:768px) { .chat-messages { padding:20px; gap:16px; } }

  .message { max-width:85%; animation:msgIn 0.3s ease; }
  @media(min-width:768px) { .message { max-width:75%; } }
  @keyframes msgIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .message.customer { align-self:flex-start; }
  .message.sales { align-self:flex-end; }
  .message .bubble {
    padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.55; word-break:break-word;
  }
  @media(min-width:768px) { .message .bubble { padding:12px 16px; border-radius:16px; } }
  .message.customer .bubble { background:#fff; border:1px solid var(--border); border-bottom-left-radius:4px; }
  .message.sales .bubble { background:var(--primary); color:#fff; border-bottom-right-radius:4px; }
  .message .time { font-size:10px; color:var(--text-secondary); margin-top:2px; }
  .message.sales .time { text-align:right; }
  .message .score-tag {
    display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; font-weight:600; margin-top:2px;
  }
  .score-high { background:#E8F5E9; color:#2E7D32; }
  .score-mid { background:#FFF3E0; color:#E65100; }
  .score-low { background:#FFEBEE; color:#C62828; }

  .message.system { align-self:center; max-width:92%; }
  .message.system .bubble {
    background:#FFF8E1; border:1px solid #FFE082; border-radius:8px; font-size:12px; color:#795548;
    padding:8px 12px;
  }
  .message.system.feedback .bubble { background:#E8F5E9; border-color:#A5D6A7; color:#2E7D32; }
  .message.system.warning .bubble { background:#FFF3E0; border-color:#FFCC80; color:#E65100; }

  /* Chat input */
  .chat-input-area {
    padding:12px 14px; border-top:1px solid var(--border); display:flex; gap:10px;
    background:#fff; border-radius:0 0 var(--radius-lg) var(--radius-lg); flex-shrink:0;
  }
  @media(min-width:768px) { .chat-input-area { padding:14px 20px; } }
  .chat-input-area textarea {
    flex:1; padding:10px 14px; border:2px solid var(--border); border-radius:10px;
    font-size:14px; resize:none; min-height:42px; max-height:100px; font-family:inherit;
    -webkit-appearance:none;
  }
  .chat-input-area textarea:focus { outline:none; border-color:var(--primary-light); }
  .chat-input-area .send-btn {
    width:42px; height:42px; border-radius:10px; background:var(--primary); color:#fff;
    border:none; cursor:pointer; font-size:18px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0; -webkit-tap-highlight-color:transparent;
  }
  .chat-input-area .send-btn:active { background:var(--primary-light); transform:scale(0.95); }
  .chat-input-area .send-btn:disabled { opacity:0.4; }

  /* Report */
  .report-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100;
    justify-content:center; align-items:flex-start; padding:12px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media(min-width:768px) { .report-overlay { align-items:center; padding:20px; } }
  .report-overlay.active { display:flex; }
  .report-card {
    background:var(--card); border-radius:var(--radius-lg); padding:24px;
    max-width:640px; width:100%; box-shadow:var(--shadow-lg); margin:auto;
  }
  @media(min-width:768px) { .report-card { padding:36px; } }
  .report-card h2 { text-align:center; color:var(--primary); margin-bottom:4px; font-size:20px; }
  .report-card .stopped-tag {
    display:inline-block; background:#FFF3E0; color:#E65100; padding:3px 10px;
    border-radius:10px; font-size:12px; font-weight:600;
  }
  .overall-score { text-align:center; margin:16px 0; }
  .overall-score .big-num {
    font-size:56px; font-weight:900; line-height:1;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .grade-badge { display:inline-block; padding:5px 16px; border-radius:16px; font-weight:700; font-size:13px; margin-top:6px; }
  .grade-excellent { background:#E8F5E9; color:#2E7D32; }
  .grade-good { background:#E3F2FD; color:#0D47A1; }
  .grade-pass { background:#FFF3E0; color:#E65100; }
  .grade-fail { background:#FFEBEE; color:#C62828; }

  .dim-scores { display:grid; grid-template-columns:1fr; gap:10px; margin:16px 0; }
  @media(min-width:480px) { .dim-scores { grid-template-columns:repeat(2,1fr); } }
  .dim-item { background:#F8FAFD; border-radius:10px; padding:14px; border-left:4px solid var(--primary); }
  .dim-item .dim-name { font-weight:600; font-size:13px; }
  .dim-item .dim-score { font-size:12px; color:var(--text-secondary); }
  .dim-item .dim-bar-bg { height:5px; background:var(--border); border-radius:3px; margin-top:6px; }
  .dim-item .dim-bar-fill { height:100%; border-radius:3px; }

  .feedback-section { margin-top:16px; }
  .feedback-section h3 { font-size:15px; color:var(--primary); margin-bottom:8px; }
  .feedback-item { padding:10px 14px; border-radius:8px; margin-bottom:6px; font-size:13px; display:flex; gap:8px; align-items:flex-start; }
  .feedback-good { background:#E8F5E9; color:#2E7D32; }
  .feedback-improve { background:#FFF3E0; color:#E65100; }
  .btn-row { display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }

  /* Admin */
  .admin-panel { display:none; }
  .admin-panel.active { display:block; }
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  @media(min-width:600px) { .stats-grid { grid-template-columns:repeat(4,1fr); } }
  .stat-card { background:var(--card); border-radius:10px; padding:16px; box-shadow:var(--shadow); text-align:center; }
  .stat-card .stat-num { font-size:26px; font-weight:800; color:var(--primary); }
  .stat-card .stat-label { font-size:12px; color:var(--text-secondary); margin-top:2px; }
  .exam-table { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .exam-table table { width:100%; border-collapse:collapse; min-width:600px; }
  .exam-table th { background:#F8FAFD; padding:10px 12px; text-align:left; font-size:12px; font-weight:600; color:var(--text-secondary); border-bottom:2px solid var(--border); white-space:nowrap; }
  .exam-table td { padding:10px 12px; font-size:13px; border-bottom:1px solid var(--border); }
  .exam-table tr:active { background:#F8FAFD; }
  .exam-table .clickable { color:var(--primary); cursor:pointer; font-weight:600; }

  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200; justify-content:center; align-items:flex-start; padding:12px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .modal-overlay.active { display:flex; }
  .modal { background:var(--card); border-radius:var(--radius-lg); padding:20px; max-width:700px; width:100%; max-height:85dvh; overflow-y:auto; box-shadow:var(--shadow-lg); margin:auto; }
  .modal h3 { color:var(--primary); margin-bottom:12px; font-size:17px; }
  .chat-transcript { background:#FAFBFC; border-radius:10px; padding:12px; max-height:350px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .transcript-msg { margin-bottom:10px; padding:8px 12px; border-radius:8px; }
  .transcript-msg.customer { background:#fff; border:1px solid var(--border); }
  .transcript-msg.sales { background:#EEF3FB; border:1px solid #C5D5EA; }
  .transcript-msg .role { font-size:10px; font-weight:600; color:var(--text-secondary); margin-bottom:2px; }
  .transcript-msg .text { font-size:13px; }
  .transcript-msg .score-info { font-size:11px; color:var(--text-secondary); margin-top:2px; }

  /* Typing */
  .typing-indicator { display:flex; gap:3px; padding:6px 0; }
  .typing-indicator span { width:7px; height:7px; background:var(--text-secondary); border-radius:50%; animation:bounce 1.4s infinite; }
  .typing-indicator span:nth-child(2) { animation-delay:0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay:0.4s; }
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-5px);} }

  .hidden { display:none !important; }
  .tab-active { background:var(--primary) !important; color:#fff !important; border-color:var(--primary) !important; }
  .examinee-report-btn { background:#EEF3FB; color:var(--primary); padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; margin-top:12px; display:inline-block; cursor:pointer; }

  /* Toast */
  .toast {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:300;
    background:#1F2937; color:#fff; padding:12px 24px; border-radius:24px; font-size:14px;
    animation:toastIn 0.3s ease, toastOut 0.3s ease 2s forwards;
    pointer-events:none;
  }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(20px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
  @keyframes toastOut { from{opacity:1;} to{opacity:0;} }
</style>
</head>
<body>

<div class="app-container" id="app">
  <!-- HEADER -->
  <div class="header">
    <div>
      <h1>🎯 跨洋狮话术考核</h1>
      <div class="subtitle">AI智能客户 · 实时评分 · 信任度追踪 <span id="aiModeBadge" style="font-size:11px;background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:8px;margin-left:4px;"></span></div>
    </div>
    <div class="header-right">
      <span class="badge" id="headerBadge">🏢 跨洋狮</span>
      <span class="badge hidden" id="userBadge" style="background:rgba(255,255,255,0.15);"></span>
      <a href="#" class="nav-link hidden" onclick="showAdmin()" id="adminLink">📊 后台</a>
      <a href="#" class="nav-link hidden" onclick="showExamEntry()" id="examLink">🎯 考核</a>
      <a href="#" class="nav-link hidden" onclick="logout()" id="logoutLink">🚪 退出</a>
    </div>
  </div>

  <!-- LOGIN -->
  <div class="setup-card" id="loginScreen">
    <h2>🔐 登录</h2>
    <div id="loginModeTabs" style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn btn-primary btn-sm" id="tabExaminee" onclick="switchLoginMode('examinee')">我是考生</button>
      <button class="btn btn-outline btn-sm" id="tabAdmin" onclick="switchLoginMode('admin')">我是管理员</button>
    </div>
    <div class="form-group">
      <label>📧 用户名</label>
      <input type="text" id="loginEmail" placeholder="输入用户名...">
    </div>
    <div class="form-group">
      <label>🔑 密码</label>
      <input type="password" id="loginPassword" placeholder="输入密码...">
    </div>
    <div class="form-group hidden" id="adminNameGroup">
      <label>👤 显示名称</label>
      <input type="text" id="adminName" placeholder="管理员名称...">
    </div>
    <button class="btn btn-primary btn-lg" id="loginBtn" onclick="handleLoginClick()">登录</button>
    <button class="btn btn-outline btn-lg hidden" id="setupAdminBtn" onclick="handleSetupAdminClick()" style="margin-top:8px;">注册首个管理员</button>
    <p id="loginTip" style="margin-top:12px;font-size:12px;color:var(--text-secondary);">考生由管理员创建账号后登录。</p>
    <p id="localModeTip" style="margin-top:12px;font-size:12px;color:var(--warning);display:none;">⚠️ 当前为本地模式，所有数据仅保存在当前设备。如需云端同步，请联系管理员配置 Supabase。</p>
  </div>

  <!-- SETUP -->
  <div class="setup-card" id="setupScreen">
    <h2>📋 开始考核</h2>
    <div class="form-group">
      <label>👤 你的姓名</label>
      <input type="text" id="traineeName" placeholder="输入姓名..." value="">
    </div>
    <div class="form-group">
      <label>📂 选择场景（可多选）</label>
      <div class="scenario-grid" id="scenarioGrid"></div>
    </div>
    <div class="form-group">
      <label>🎯 难度</label>
      <select id="difficulty">
        <option value="easy">初级 - 客户配合度高</option>
        <option value="medium" selected>中级 - 标准客户+常见异议</option>
        <option value="hard">高级 - 高难度客户</option>
      </select>
    </div>
    <button class="btn btn-primary btn-lg" onclick="startExam()">🚀 开始考核</button>
  </div>

  <!-- EXAM -->
  <div class="exam-layout" id="examScreen">
    <div class="exam-sidebar">
      <div class="metric-row">
        <div class="metric-box metric-trust">

<script>

// ═══════════════════════════════════════════════════════════════
//  内嵌后端逻辑 — 无需服务器
// ═══════════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════════
//  云端存储 — GitHub Gist
// ═══════════════════════════════════════════════════════════════
const GIST_ID = '25e2e29f89420ee083546325807899df';
const GIST_API = 'https://api.github.com/gists/' + GIST_ID;
const GIST_RAW = 'https://gist.githubusercontent.com/arno9420-byte/' + GIST_ID + '/raw/db.json';
// Token 从 URL hash 读取（首次访问在网址后加 #你的token），之后存 localStorage
function getGistToken() {
  const fromLS = localStorage.getItem('_gt');
  if (fromLS) return fromLS;
  const fromHash = window.location.hash.replace('#', '');
  if (fromHash && fromHash.startsWith('ghp_')) {
    localStorage.setItem('_gt', fromHash);
    // 静默清除 hash，不刷新页面
    history.replaceState(null, '', window.location.pathname + window.location.search);
    return fromHash;
  }
  return '';
}

let cloudMode = false;
let currentUser = null; // { id, role, displayName }
let gistCache = null;
let gistCacheTime = 0;

async function loadGistData() {
  const now = Date.now();
  if (gistCache && (now - gistCacheTime) < 5000) return gistCache;
  // 加上随机参数绕过 CDN 缓存
  const resp = await fetch(GIST_RAW + '?t=' + now + '&r=' + Math.random());
  if (!resp.ok) throw new Error('Gist 加载失败');
  gistCache = await resp.json();
  gistCacheTime = now;
  return gistCache;
}

async function saveGistData(data) {
  gistCache = data;
  gistCacheTime = Date.now();
  const resp = await fetch(GIST_API, {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + getGistToken(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ files: { 'db.json': { content: JSON.stringify(data) } } })
  });
  if (!resp.ok) throw new Error('Gist 保存失败: ' + resp.status);
  return true;
}

// 强制刷新缓存（写入后调用）
async function refreshGistCache() {
  gistCacheTime = 0; // 清缓存
  await loadGistData();
}

// ── SQLite via sql.js (loaded from CDN) — 本地回退 ──
let SQL = null;
let db = null;

async function initDatabase() {
  if (db) return db;
  if (!SQL) {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js';
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load sql.js'));
      document.head.appendChild(script);
    });
    SQL = await initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f });
  }
  const saved = localStorage.getItem('exam_db_data');
  if (saved) {
    try { db = new SQL.Database(new Uint8Array(JSON.parse(saved))); }
    catch(e) { db = new SQL.Database(); }
  } else {
    db = new SQL.Database();
  }
  db.run(`CREATE TABLE IF NOT EXISTS exams (
    id TEXT PRIMARY KEY, trainee_name TEXT, difficulty TEXT, scenarios TEXT,
    overall_score INTEGER, grade TEXT, started_at TEXT, finished_at TEXT, status TEXT DEFAULT 'in_progress'
  )`);
  db.run(`CREATE TABLE IF NOT EXISTS exam_messages (
    id INTEGER PRIMARY KEY AUTOINCREMENT, exam_id TEXT, scenario_id TEXT,
    round_index INTEGER, role TEXT, content TEXT, score INTEGER, feedback TEXT, score_details TEXT, created_at TEXT DEFAULT (datetime('now'))
  )`);
  db.run(`CREATE TABLE IF NOT EXISTS scenario_scores (
    id INTEGER PRIMARY KEY AUTOINCREMENT, exam_id TEXT, scenario_id TEXT,
    total_score INTEGER, max_score INTEGER, percentage INTEGER
  )`);
  db.run(`CREATE TABLE IF NOT EXISTS exam_metrics (
    id INTEGER PRIMARY KEY AUTOINCREMENT, exam_id TEXT, scenario_id TEXT,
    round_index INTEGER, trust_level INTEGER, intent_level INTEGER,
    trust_delta INTEGER, intent_delta INTEGER, created_at TEXT DEFAULT (datetime('now'))
  )`);
  return db;
}

function saveDb() {
  if (!db) return;
  try { localStorage.setItem('exam_db_data', JSON.stringify(Array.from(db.export()))); }
  catch(e) { console.warn('Failed to save DB to localStorage:', e.message); }
}

function dbRun(sql, params = []) { db.run(sql, params); saveDb(); }

function dbGet(sql, params = []) {
  const stmt = db.prepare(sql); stmt.bind(params);
  if (stmt.step()) {
    const cols = stmt.getColumnNames(); const vals = stmt.get();
    const row = {}; cols.forEach((c, i) => row[c] = vals[i]);
    stmt.free(); return row;
  }
  stmt.free(); return null;
}

function dbAll(sql, params = []) {
  const stmt = db.prepare(sql); stmt.bind(params);
  const rows = [];
  while (stmt.step()) {
    const cols = stmt.getColumnNames(); const vals = stmt.get();
    const row = {}; cols.forEach((c, i) => row[c] = vals[i]);
    rows.push(row);
  }
  stmt.free(); return rows;
}

// ═══════════════════════════════════════════════════════════════
//  Gist 云端数据访问层
// ═══════════════════════════════════════════════════════════════
const dataLayer = {
  enabled: () => !!currentUser,

  _db() {
    // 优先用内存缓存（写操作会直接更新缓存），避免 CDN 延迟
    if (gistCache) return Promise.resolve(gistCache);
    return loadGistData();
  },

  async _save(db) {
    await saveGistData(db);
  },

  async insertExam(row) {
    if (!this.enabled()) {
      dbRun('INSERT INTO exams (id, trainee_name, difficulty, scenarios, overall_score, grade, started_at, finished_at, status) VALUES (?,?,?,?,?,?,?,?,?)',
        [row.id, row.trainee_name, row.difficulty, row.scenarios, row.overall_score||null, row.grade||null, row.started_at, row.finished_at||null, row.status||'in_progress']);
      return;
    }
    const db = await this._db();
    db.exams.push({ ...row, userId: currentUser.id });
    await this._save(db);
  },

  async updateExam(id, fields) {
    if (!this.enabled()) {
      const keys = Object.keys(fields);
      const setClause = keys.map(k => `${k} = ?`).join(',');
      dbRun(`UPDATE exams SET ${setClause} WHERE id = ?`, [...Object.values(fields), id]);
      return;
    }
    const db = await this._db();
    const exam = db.exams.find(e => e.id === id);
    if (exam) Object.assign(exam, fields);
    await this._save(db);
  },

  async getExam(id) {
    if (!this.enabled()) return dbGet('SELECT * FROM exams WHERE id = ?', [id]);
    const db = await this._db();
    return db.exams.find(e => e.id === id) || null;
  },

  async listExams(filters = {}) {
    if (!this.enabled()) {
      const where = []; const params = [];
      if (filters.userId) { where.push('user_id = ?'); params.push(filters.userId); }
      if (filters.traineeName) { where.push('trainee_name = ?'); params.push(filters.traineeName); }
      const sql = 'SELECT * FROM exams' + (where.length ? ' WHERE ' + where.join(' AND ') : '') + ' ORDER BY started_at DESC';
      return dbAll(sql, params);
    }
    const db = await this._db();
    let exams = db.exams;
    if (filters.userId) exams = exams.filter(e => e.userId === filters.userId);
    if (filters.traineeName) exams = exams.filter(e => e.trainee_name === filters.traineeName);
    return exams.sort((a,b) => (b.started_at||'').localeCompare(a.started_at||''));
  },

  async insertMessage(row) {
    if (!this.enabled()) {
      dbRun('INSERT INTO exam_messages (exam_id, scenario_id, round_index, role, content, score, feedback, score_details) VALUES (?,?,?,?,?,?,?,?)',
        [row.exam_id, row.scenario_id, row.round_index, row.role, row.content, row.score||null, row.feedback||null, row.score_details||null]);
      return;
    }
    const db = await this._db();
    row.id = (db.messages.length + 1);
    row.created_at = row.created_at || new Date().toISOString();
    db.messages.push(row);
    await this._save(db);
  },

  async getMessages(examId, scenarioId) {
    if (!this.enabled()) {
      if (scenarioId) return dbAll('SELECT * FROM exam_messages WHERE exam_id = ? AND scenario_id = ? ORDER BY id', [examId, scenarioId]);
      return dbAll('SELECT * FROM exam_messages WHERE exam_id = ? ORDER BY id', [examId]);
    }
    const db = await this._db();
    return db.messages.filter(m => m.exam_id === examId && (!scenarioId || m.scenario_id === scenarioId)).sort((a,b) => (a.id||0)-(b.id||0));
  },

  async getSalesScores(examId, scenarioId) {
    if (!this.enabled()) {
      return dbAll('SELECT score FROM exam_messages WHERE exam_id = ? AND scenario_id = ? AND role = ? AND score IS NOT NULL',
        [examId, scenarioId, 'sales']);
    }
    const db = await this._db();
    return db.messages.filter(m => m.exam_id === examId && m.scenario_id === scenarioId && m.role === 'sales' && m.score != null);
  },

  async insertMetric(row) {
    if (!this.enabled()) {
      dbRun('INSERT INTO exam_metrics (exam_id, scenario_id, round_index, trust_level, intent_level, trust_delta, intent_delta) VALUES (?,?,?,?,?,?,?)',
        [row.exam_id, row.scenario_id, row.round_index, row.trust_level, row.intent_level, row.trust_delta, row.intent_delta]);
      return;
    }
    const db = await this._db();
    if (!db.metrics) db.metrics = [];
    db.metrics.push(row);
    await this._save(db);
  },

  async insertScenarioScore(row) {
    if (!this.enabled()) {
      dbRun('INSERT INTO scenario_scores (exam_id, scenario_id, total_score, max_score, percentage) VALUES (?,?,?,?,?)',
        [row.exam_id, row.scenario_id, row.total_score, row.max_score, row.percentage]);
      return;
    }
    const db = await this._db();
    if (!db.scores) db.scores = [];
    const existing = db.scores.find(s => s.exam_id === row.exam_id && s.scenario_id === row.scenario_id);
    if (existing) Object.assign(existing, row);
    else db.scores.push(row);
    await this._save(db);
  },

  async getScenarioScores(examId) {
    if (!this.enabled()) return dbAll('SELECT * FROM scenario_scores WHERE exam_id = ?', [examId]);
    const db = await this._db();
    return (db.scores || []).filter(s => s.exam_id === examId);
  },

  async deleteExam(id) {
    if (!this.enabled()) {
      dbRun('DELETE FROM exam_messages WHERE exam_id = ?', [id]);
      dbRun('DELETE FROM scenario_scores WHERE exam_id = ?', [id]);
      dbRun('DELETE FROM exam_metrics WHERE exam_id = ?', [id]);
      dbRun('DELETE FROM exams WHERE id = ?', [id]);
      return;
    }
    const db = await this._db();
    db.exams = db.exams.filter(e => e.id !== id);
    db.messages = db.messages.filter(m => m.exam_id !== id);
    db.scores = (db.scores || []).filter(s => s.exam_id !== id);
    db.metrics = (db.metrics || []).filter(m => m.exam_id !== id);
    await this._save(db);
  }
};

// ═══════════════════════════════════════════════════════════════
//  认证系统（基于 Gist 用户列表）
// ═══════════════════════════════════════════════════════════════
async function login(username, password) {
  const db = await loadGistData();
  const user = (db.users || []).find(u => u.id === username && u.password === password);
  if (!user) throw new Error('用户名或密码错误');
  currentUser = { id: user.id, role: user.role, displayName: user.displayName };
  cloudMode = true;
  return currentUser;
}

function logout() {
  currentUser = null;
  cloudMode = false;
  showLoginScreen();
}

async function createUser(id, password, displayName, role) {
  if (!currentUser || currentUser.role !== 'admin') throw new Error('只有管理员可以创建账号');
  const db = await loadGistData();
  if (db.users.find(u => u.id === id)) throw new Error('账号已存在');
  db.users.push({ id, password, displayName, role });
  await saveGistData(db);
  return { id, password, displayName, role };
}

function generateTempPassword() {
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let pw = '';
  for (let i = 0; i < 8; i++) pw += chars[Math.floor(Math.random() * chars.length)];
  return pw;
}

// ── UUID generator (browser-compatible) ──
function generateUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

// ── LLM Client (browser fetch) ──
const LLM_PROVIDERS = {
  deepseek: { baseURL: 'https://api.deepseek.com/v1', defaultModel: 'deepseek-chat', name: 'DeepSeek' },
  openai: { baseURL: 'https://api.openai.com/v1', defaultModel: 'gpt-4o-mini', name: 'OpenAI' },
  zhipu: { baseURL: 'https://open.bigmodel.cn/api/paas/v4', defaultModel: 'glm-4-flash', name: '智谱GLM' },
};

// DeepSeek 默认配置（写死，开箱即用）
const DEFAULT_LLM = {
  provider: 'deepseek',
  apiKey: 'sk-611e8d19ed6d42d58b53a54720dce252',
  model: 'deepseek-chat',
  enabled: true
};

let llmConfig = {
  provider: DEFAULT_LLM.provider,
  apiKey: DEFAULT_LLM.apiKey,
  model: DEFAULT_LLM.model,
  temperature: 0.85,
  timeout: 15000,
  enabled: DEFAULT_LLM.enabled,
  consecutiveFailures: 0,
  maxFailures: 3,
};

function getLlmConfig() {
  return {
    provider: llmConfig.provider,
    model: llmConfig.model || (LLM_PROVIDERS[llmConfig.provider]?.defaultModel || 'deepseek-chat'),
    enabled: llmConfig.enabled,
    hasKey: !!llmConfig.apiKey,
    temperature: llmConfig.temperature,
    failures: llmConfig.consecutiveFailures,
  };
}

async function loadLlmConfigFromCloud() {
  try {
    const db = await loadGistData();
    const cfg = db.llmConfig || {};
    // 云端有配置就用云端的，否则用写死的默认值
    if (cfg.provider && cfg.apiKey) {
      llmConfig.provider = cfg.provider;
      llmConfig.apiKey = cfg.apiKey;
      llmConfig.model = cfg.model || DEFAULT_LLM.model;
      llmConfig.enabled = true;
    }
    llmConfig.consecutiveFailures = 0;
  } catch (e) {
    console.warn('[LLM] 从云端加载配置失败，使用默认配置:', e.message);
  }
  return getLlmConfig();
}

async function updateLlmConfigBrowser(newConfig) {
  if (newConfig.provider !== undefined) llmConfig.provider = newConfig.provider;
  if (newConfig.apiKey !== undefined) {
    llmConfig.apiKey = newConfig.apiKey;
    llmConfig.enabled = !!newConfig.apiKey;
  }
  if (newConfig.model !== undefined) llmConfig.model = newConfig.model;
  llmConfig.consecutiveFailures = 0;

  if (currentUser && currentUser.role === 'admin') {
    // 仅管理员可写入云端
    if (currentUser.role !== 'admin') throw new Error('只有管理员可以修改大模型配置');
    try {
      const db = await loadGistData();
      db.llmConfig = {
        provider: llmConfig.provider,
        apiKey: llmConfig.apiKey,
        model: llmConfig.model,
        enabled: llmConfig.enabled
      };
      await saveGistData(db);
    } catch(e) {
      console.warn('[LLM] 云端保存失败，回退本地:', e.message);
    }
  }
  // 本地回退
  if (newConfig.provider !== undefined) localStorage.setItem('llm_provider', newConfig.provider);
  if (newConfig.apiKey !== undefined) localStorage.setItem('llm_api_key', newConfig.apiKey);
  if (newConfig.model !== undefined) localStorage.setItem('llm_model', newConfig.model);
  return getLlmConfig();
}

async function generateCustomerReplyLLM(salesMsg, context) {
  if (llmConfig.consecutiveFailures >= llmConfig.maxFailures) return null;
  if (!llmConfig.apiKey) return null;

  const provider = LLM_PROVIDERS[llmConfig.provider];
  const baseURL = provider?.baseURL || 'https://api.deepseek.com/v1';
  const model = llmConfig.model || provider?.defaultModel || 'deepseek-chat';
  const systemPrompt = buildSystemPrompt(context);
  const messages = buildLLMMessages(systemPrompt, context.historyMsgs || [], salesMsg);

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), llmConfig.timeout);

    const resp = await fetch(baseURL + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + llmConfig.apiKey,
      },
      body: JSON.stringify({
        model,
        messages,
        temperature: llmConfig.temperature,
        max_tokens: 300,
        top_p: 0.9,
      }),
      signal: controller.signal,
    });

    clearTimeout(timeout);

    if (!resp.ok) {
      if (resp.status === 401 || resp.status === 403) {
        llmConfig.enabled = false;
        console.error('[LLM] API Key 无效');
      }
      llmConfig.consecutiveFailures++;
      return null;
    }

    const data = await resp.json();
    llmConfig.consecutiveFailures = 0;
    const reply = data.choices?.[0]?.message?.content?.trim();
    if (!reply) return null;
    return cleanLLMReply(reply);
  } catch (e) {
    llmConfig.consecutiveFailures++;
    console.error('[LLM] 调用失败:', e.message?.slice(0, 80));
    return null;
  }
}

function buildSystemPrompt(context) {
  const { scenarioId, customerType, roundIndex, difficulty } = context;
  const p = getPersonalityProfile(customerType);
  const s = getScenarioProfile(scenarioId);
  return `你正在扮演一���外贸公司的老板/负责人，正在和"跨洋狮"公司的销售沟通。

## 你的背景
${p.backstory}

## 你的性格
${p.traits}

## 说话风格
${p.speech}

## 当前场景
${s.context}
这是对话的第 ${roundIndex + 1} 轮。

## 核心规则
1. 用真实口语化的中文回复，像微信聊天一样自然
2. 回复1-3句话，不要长篇大论
3. 如果销售催你交钱、态度pushy、或讲套话 → 表达不满

function buildLLMMessages(systemPrompt, historyMsgs, currentSalesMsg) {
  const msgs = [{ role: 'system', content: systemPrompt }];
  const recent = (historyMsgs || []).slice(-20);
  for (const msg of recent) {
    if (msg.role === 'sales') {
      msgs.push({ role: 'user', content: '销售说：' + msg.content });
    } else {
      msgs.push({ role: 'assistant', content: msg.content });
    }
  }
  msgs.push({ role: 'user', content: '销售说：' + currentSalesMsg });
  return msgs;
}

function cleanLLMReply(text) {
  let cleaned = text
    .replace(/^(客户|顾客|老板|我|你)说?[：:]\s*/i, '')
    .replace(/^["「『]\s*/, '')
    .replace(/\s*["」』]$/, '')
    .replace(/^["']|["']$/g, '')
    .replace(/```[\s\S]*?```/g, '')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '')
    .trim();
  if (!cleaned || cleaned.length < 1) return null;
  if (cleaned.length > 500) cleaned = cleaned.slice(0, 500) + '...';
  return cleaned;
}

// ═══════════════════════════════════════════════════════
//  对话记忆网络
// ═══════════════════════════════════════════════════════

class ConversationMemory {
  constructor() {
    this.topics = {};
    this.unansweredQuestions = [];
    this.salesPromises = [];
    this.emotionalPeaks = [];
    this.keyPoints = [];
  }

  trackTopic(topic, depth) {
    if (!this.topics[topic]) this.topics[topic] = 0;
    this.topics[topic] += depth || 1;
  }

  addQuestion(question) {
    this.unansweredQuestions.push({ question, askedAt: Date.now() });
  }

  markQuestionAnswered() {
    if (this.unansweredQuestions.length > 0) {
      this.unansweredQuestions.shift();
    }
  }

  addPromise(promise) {
    this.salesPromises.push({ promise, madeAt: Date.now() });
  }

  addEmotionalPeak(emotion, intensity) {
    this.emotionalPeaks.push({ emotion, intensity, at: Date.now() });
  }

  getPendingQuestions() {
    return this.unansweredQuestions;
  }

  getSummary() {
    return {
      topicCount: Object.keys(this.topics).length,
      pendingQuestions: this.unansweredQuestions.length,
      promises: this.salesPromises.length,
      emotionalEvents: this.emotionalPeaks.length,
    };
  }
}

// ═══════════════════════════════════════════════════════
//  消息分析器
// ═══════════════════════════════════════════════════════

function analyzeMessage(msg) {
  const lower = msg.toLowerCase();

  return {
    length: msg.length,
    sentenceCount: (msg.match(/[。！？.!?\n]/g) || []).length + 1,

    // 沟通风格
    hasGreeting: /你好|您好|hi\b|hello|早上好|下午好|晚上好/i.test(msg),
    hasSelfIntro: /我是|我叫|我们公司|我们团队|跨洋狮|金讯博/i.test(msg),
    hasQuestion: /[？?]/.test(msg) || /什么|怎么|如何|能不能|可以吗|行吗|方便吗/.test(msg),
    hasPolite: /您|请|谢谢|麻烦|方便|打扰|不好意思/i.test(msg),
    hasEmpathy: /理解|明白|确实|知道|感受|不容易|我懂|我明白|你说得对/i.test(msg),
    hasHumor: /哈哈|笑|有趣|好玩/i.test(msg),

    // 内容特征
    hasPrice: /2980|688|价格|费用|收费|多少钱|便宜|贵|预算|成本|投资|元|块/i.test(msg),
    hasProduct: /WordPress|SaaS|建站|网站|独立站|官网|网页/i.test(msg),
    hasCase: /案例|客户|同行|之前|做过|成功|例子|比如|举例/i.test(msg),
    hasData: /数据|数字|百分之|\d+%|\d+个|\d+家|\d+万/i.test(msg),
    hasValue: /价值|回报|收益|效果|增长|好处|优势|提升|帮助/i.test(msg),
    hasSolution: /方案|解决|办法|建议|推荐|适合|可以这样|我们可以/i.test(msg),
    hasUrgency: /限时|名额|排期|优惠|错过|抓紧|马上|赶紧|现在/i.test(msg),
    hasClose: /合同|付款|成交|确定|定了|锁定|签约|下单|开始做/i.test(msg),
    hasNextStep: /明天|下次|联系|微信|加我|发你|发您|约|见面|聊/i.test(msg),
    hasComparison: /对比|比较|区别|差别|vs|和.*比|阿里|淘宝|shopify/i.test(msg),
    hasGuarantee: /保障|保证|合同|退款|售后|放心|承诺|包/i.test(msg),
    hasTechnical: /SEO|域名|服务器|插件|代码|HTML|CSS|PHP|SSL|备案/i.test(msg),
    hasEmotion: /担心|怕|焦虑|着急|纠结|犹豫|烦|头疼/i.test(msg),

    // 负面特征
    isTooShort: msg.length < 12,
    isTooLong: msg.length > 400,
    isPushy: /必须|一定|不买就|错过就|赶紧|现在就|立刻|马上定/i.test(msg),
    isDismissive: /随便|无所谓|不重要|没关系|没事|算了/i.test(msg),
    isDefensive: /不是|没有|你错了|不对|怎么可能/i.test(msg),
    isRobotic: /尊敬的|您好.*很高兴|感谢您的|我们将竭诚/i.test(msg),

    // 正面特征
    isStructured: msg.length > 40 && /[，。；\n]/.test(msg) && (msg.match(/[，。；\n]/g) || []).length >= 2,
    isSpecific: /\d+/.test(msg) && msg.length > 25,
    hasStory: /之前|曾经|有一次|上次|那时候|当时/i.test(msg),
    isProfessional: ['根据', '分析', '建议', '方案', '对比', '数据', '案例'].filter(w => msg.includes(w)).length >= 2,
  };
}

// ═══════════════════════════════════════════════════════
//  客户状态机 — 核心决策引擎
// ═══════════════════════════════════════════════════════

class CustomerState {
  constructor(personalityId, scenarioId, difficulty) {
    const p = PERSONALITIES[personalityId];
    this.personality = p;
    this.scenarioId = scenarioId;
    this.difficulty = difficulty;

    this.trust = p.baseTrust;
    this.intent = p.baseIntent;
    this.comfort = 50;
    this.interest = 35;
    this.urgency = 15;

    this.phaseIndex = 0;
    this.isWarmingUp = false;
    this.isAnnoyed = false;
    this.isConvinced = false;
    this.isAboutToLeave = false;

    this.timesPriceMentioned = 0;
    this.timesCaseRequested = 0;
    this.timesDodged = 0;
    this.timesPressured = 0;
    this.roundsSinceLastValue = 0;

    this.memory = new ConversationMemory();
  }

  getCurrentPhase(roundIndex) {
    const scenario = SCENARIOS[this.scenarioId];
    if (!scenario) return { name: '未知', description: '' };
    for (const phase of scenario.phases) {
      if (phase.rounds.includes(roundIndex)) return phase;
    }
    return scenario.phases[scenario.phases.length - 1] || { name: '尾声', description: '' };
  }

  processMessage(msg, analysis, roundIndex, historyMsgs) {
    const phase = this.getCurrentPhase(roundIndex);
    const p = this.personality;

    let trustDelta = 0;
    let intentDelta = 0;
    let comfortDelta = 0;
    let interestDelta = 0;

    // ──── 信任变化 ────
    if (analysis.hasEmpathy) trustDelta += 7;
    if (analysis.isProfessional) trustDelta += 5;
    if (analysis.hasCase || analysis.hasData) trustDelta += 6;
    if (analysis.hasGuarantee) trustDelta += 4;
    if (analysis.hasSelfIntro && roundIndex === 0) trustDelta += 5;
    if (analysis.hasPolite) trustDelta += 2;
    if (analysis.isSpecific) trustDelta += 3;
    if (analysis.hasStory) trustDelta += 4;

    if (analysis.isRobotic) trustDelta -= 8;
    if (analysis.isPushy) trustDelta -= 12;
    if (analysis.isDismissive) trustDelta -= 6;
    if (analysis.isTooShort && roundIndex > 0) trustDelta -= 7;
    if (analysis.isDefensive) trustDelta -= 5;
    this.timesDodged += analysis.isDefensive ? 1 : 0;
    if (this.timesDodged >= 2) trustDelta -= 4;

    // ──── 购买意愿变化 ────
    if (analysis.hasValue && !analysis.isPushy) intentDelta += 8;
    if (analysis.hasCase) intentDelta += 7;
    if (analysis.hasSolution) intentDelta += 6;
    if (analysis.hasComparison) intentDelta += 5;
    if (analysis.hasData) intentDelta += 6;
    if (analysis.hasGuarantee) intentDelta += 5;
    if (analysis.hasClose && this.trust >= 50) intentDelta += 8;
    if (analysis.hasNextStep) intentDelta += 3;

    if (analysis.isPushy) intentDelta -= 10;
    if (analysis.isRobotic) intentDelta -= 6;
    if (analysis.isTooShort) intentDelta -= 5;
    if (this.timesPressured >= 2) intentDelta -= 4;
    this.timesPressured += analysis.isPushy ? 1 : 0;

    // ──── 舒适度变化 ────
    if (analysis.hasHumor) comfortDelta += 8;
    if (analysis.hasEmpathy) comfortDelta += 6;
    if (analysis.hasPolite) comfortDelta += 3;
    if (analysis.isTooLong) comfortDelta -= 3;
    if (analysis.isPushy) comfortDelta -= 10;
    if (analysis.isRobotic) comfortDelta -= 8;

    // ──── 兴趣度变化 ────
    if (analysis.hasStory) interestDelta += 6;
    if (analysis.hasCase) interestDelta += 5;
    if (analysis.hasData) interestDelta += 4;
    if (analysis.hasQuestion) interestDelta += 3;
    this.roundsSinceLastValue = (analysis.hasValue || analysis.hasCase || analysis.hasData) ? 0 : this.roundsSinceLastValue + 1;
    if (this.roundsSinceLastValue >= 3) interestDelta -= 5;

    // ──── 客户类型修正 ────
    switch (p.id) {
      case 'price':
        if (/性价比|投入产出|算.*账|划算|长期.*省|一次.*终身/i.test(msg)) {
          trustDelta += 4; intentDelta += 5;
        }
        if (/便宜|降价|打折|优惠|砍价|便宜点/i.test(msg) && !/价值|服务|质量|保障/i.test(msg)) {
          intentDelta -= 2;
        }
        this.timesPriceMentioned += analysis.hasPrice ? 1 : 0;
        if (this.timesPriceMentioned > 3 && !analysis.hasValue) {
          trustDelta -= 3;
        }
        break;

      case 'cognition':
        if (/简单|容易|比如|举例|像.*一样|类比|打个比方|大白话/i.test(msg)) {
          trustDelta += 5; intentDelta += 6; comfortDelta += 4;
        }
        if (analysis.hasTechnical) {
          trustDelta -= 4; comfortDelta -= 4; interestDelta -= 3;
        }
        if (analysis.hasStory || analysis.hasCase) {
          interestDelta += 3;
        }
        break;

      case 'decision':
        if (/方案|资料|对比|打印|说服|合伙人|给他看|参考/i.test(msg)) {
          trustDelta += 6; intentDelta += 5; comfortDelta += 3;
        }
        if (/马上|立刻|赶紧|今天就|不用商量|你自己定/i.test(msg)) {
          trustDelta -= 6; comfortDelta -= 5;
        }
        if (analysis.hasNextStep && /方案|资料|文档|PPT/i.test(msg)) {
          intentDelta += 4;
        }
        break;

      case 'silent':
        if (/方便|简短|不打扰|有空|随时|你忙|不着急/i.test(msg)) {
          trustDelta += 6; comfortDelta += 4;
        }
        if (msg.length > 250) {
          trustDelta -= 2; comfortDelta -= 3;
        }
        if (analysis.hasStory) {
          interestDelta += 4;
        }
        break;
    }

    // ──── 难度修正 ────
    const diffMod = { easy: 1.3, medium: 1.0, hard: 0.65 };
    const mod = diffMod[this.difficulty] || 1;
    trustDelta = Math.round(trustDelta * mod);
    intentDelta = Math.round(intentDelta * mod);
    comfortDelta = Math.round(comfortDelta * mod);
    interestDelta = Math.round(interestDelta * mod);

    if (roundIndex > 3 && trustDelta >= 0) trustDelta += 2;
    if (this.comfort > 60 && trustDelta >= 0) trustDelta += 1;

    this.trust = clamp(this.trust + trustDelta, 0, 100);
    this.intent = clamp(this.intent + intentDelta, 0, 100);
    this.comfort = clamp(this.comfort + comfortDelta, 0, 100);
    this.interest = clamp(this.interest + interestDelta, 0, 100);

    this.isWarmingUp = this.comfort > 55 && this.trust > 35;
    this.isAnnoyed = this.comfort < 25 || this.timesPressured >= 3;
    this.isConvinced = this.trust > 60 && this.intent > 55;
    this.isAboutToLeave = this.interest < 15 || this.comfort < 15;

    if (analysis.hasPrice) this.memory.trackTopic('价格', 2);
    if (analysis.hasProduct) this.memory.trackTopic('产品', 1);
    if (analysis.hasCase) this.memory.trackTopic('案例', 1);
    if (analysis.hasValue) this.memory.trackTopic('价值', 2);
    if (analysis.hasGuarantee) this.memory.trackTopic('保障', 1);
    if (analysis.hasTechnical) this.memory.trackTopic('技术', 1);
    if (analysis.hasComparison) this.memory.trackTopic('对比', 1);

    return {
      trustDelta, intentDelta, comfortDelta, interestDelta,
      trust: this.trust, intent: this.intent,
      comfort: this.comfort, interest: this.interest,
    };
  }
}

// ═══════════════════════════════════════════════════════
//  回复生成器
// ═══════════════════════════════════════════════════════

async function generateResponse(salesMsg, scenarioId, customerType, roundIndex, historyMsgs, difficulty) {
  const p = PERSONALITIES[customerType];

  // ── 尝试 LLM ──
  try {
    const llmReply = await llmClient.generateCustomerReply(salesMsg, {
      scenarioId,
      customerType,
      roundIndex,
      historyMsgs,
      difficulty,
      state: null,
    });
    if (llmReply) {
      return llmReply;
    }
  } catch (e) {
    console.log('[customer-ai] LLM 不可用，降级到规则引擎');
  }

  // ── Fallback: 规则引擎 ──
  const analysis = analyzeMessage(salesMsg);
  const phase = getPhase(scenarioId, roundIndex);

  let moodCategory = 'neutral';

  if (analysis.isPushy) moodCategory = 'annoyed';
  else if (analysis.isRobotic) moodCategory = 'skeptical';
  else if (analysis.isTooShort && roundIndex > 0) moodCategory = 'annoyed';
  else if (analysis.hasEmpathy && analysis.isProfessional) moodCategory = 'positive';
  else if (analysis.hasStory || (analysis.hasCase && analysis.hasData)) moodCategory = 'positive';
  else if (analysis.hasValue && !analysis.isPushy) moodCategory = 'positive';
  else if (p.id === 'silent') moodCategory = 'cold';
  else if (roundIndex === 0 && !analysis.hasSelfIntro) moodCategory = 'skeptical';

  const strategy = selectStrategy(moodCategory, p, analysis, roundIndex, historyMsgs, phase);
  return buildResponse(strategy, p, analysis, phase, historyMsgs, difficulty);
}

function getPhase(scenarioId, roundIndex) {
  const s = SCENARIOS[scenarioId];
  if (!s) return { name: '对话中', description: '' };
  for (const phase of s.phases) {
    if (phase.rounds.includes(roundIndex)) return phase;
  }
  return s.phases[s.phases.length - 1] || { name: '对话中', description: '' };
}

function selectStrategy(mood, personality, analysis, roundIndex, history, phase) {
  const p = personality;

  if (roundIndex === 0) {
    return { type: 'opening', mood: 'neutral', priority: 'respond_to_sales' };
  }

  switch (mood) {
    case 'positive':
      return selectPositiveStrategy(p, analysis, phase, history);
    case 'skeptical':
      return selectSkepticalStrategy(p, analysis, phase);
    case 'annoyed':
      return selectAnnoyedStrategy(p, analysis, phase);
    case 'cold':
      return selectColdStrategy(p, analysis, phase);
    default:
      return selectNeutralStrategy(p, analysis, phase, history);
  }
}

function selectPositiveStrategy(p, analysis, phase) {
  const strategies = [];
  if (analysis.hasCase && !analysis.hasClose) {
    strategies.push({ type: 'ask_for_more_cases', weight: 4 });
  }
  if (analysis.hasSolution) {
    strategies.push({ type: 'ask_implementation_details', weight: 3 });
  }
  if (analysis.hasValue && !analysis.hasPrice) {
    strategies.push({ type: 'show_interest_in_value', weight: 3 });
  }
  if (analysis.hasNextStep) {
    strategies.push({ type: 'agree_to_next_step', weight: 4 });
  }
  if (analysis.hasClose && phase.name === '决定时刻') {
    strategies.push({ type: 'ready_to_close', weight: 5 });
  }
  if (analysis.hasEmpathy && analysis.isProfessional) {
    strategies.push({ type: 'express_appreciation', weight: 3 });
  }
  strategies.push({ type: 'warm_continuation', weight: 2 });
  return weightedPick(strategies);
}

function selectSkepticalStrategy(p, analysis, phase) {
  const strategies = [];
  if (analysis.hasPrice && !analysis.hasValue) {
    strategies.push({ type: 'challenge_price', weight: 5 });
  }
  if (analysis.hasTechnical) {
    strategies.push({ type: 'confused_by_tech', weight: 3 });
  }
  if (p.id === 'price' && !analysis.hasComparison) {
    strategies.push({ type: 'compare_with_cheaper', weight: 4 });
  }
  if (p.id === 'cognition' && !analysis.hasCase) {
    strategies.push({ type: 'doubt_effectiveness', weight: 4 });
  }
  if (p.id === 'decision' && !analysis.hasNextStep) {
    strategies.push({ type: 'mention_partner_block', weight: 4 });
  }
  strategies.push({ type: 'express_doubt', weight: 2 });
  return weightedPick(strategies);
}

function selectAnnoyedStrategy(p, analysis, phase) {
  return {
    type: 'push_back',
    sub: analysis.isPushy ? 'too_pushy' : analysis.isRobotic ? 'too_robotic' : 'general_annoyance',
  };
}

function selectColdStrategy(p, analysis, phase) {
  if (analysis.hasQuestion) return { type: 'brief_answer', weight: 1 };
  if (analysis.hasStory || analysis.hasCase) return { type: 'slight_interest', weight: 1 };
  return { type: 'minimal_ack', weight: 1 };
}

function selectNeutralStrategy(p, analysis, phase, history) {
  const strategies = [];
  if (analysis.hasQuestion && !analysis.hasSolution) {
    strategies.push({ type: 'waiting_for_answer', weight: 3 });
  }
  if (phase.name === '试探' || phase.name === '现状探询') {
    strategies.push({ type: 'share_current_situation', weight: 3 });
  }
  if (p.id === 'price') {
    strategies.push({ type: 'mention_budget_concern', weight: 2 });
  }
  strategies.push({ type: 'neutral_continuation', weight: 1 });
  return weightedPick(strategies);
}

function weightedPick(items) {
  const total = items.reduce((s, i) => s + (i.weight || 1), 0);
  let rand = Math.random() * total;
  for (const item of items) {
    rand -= (item.weight || 1);
    if (rand <= 0) return item;
  }
  return items[0];
}

function buildResponse(strategy, p, analysis, phase, history, difficulty) {
  const candidates = getCandidates(strategy, p, analysis, phase, difficulty);
  const historyTexts = new Set(history.map(h => h.content));
  const fresh = candidates.filter(c => !historyTexts.has(c));
  const pool = fresh.length > 0 ? fresh : candidates;
  const response = pool[Math.floor(Math.random() * pool.length)];
  return postProcess(response, p, analysis);
}

function postProcess(response, p, analysis) {
  let text = response;

  if (p.id === 'price') {
    if (Math.random() < 0.3 && !text.startsWith('说实话')) {
      text = '说实话，' + text.charAt(0).toLowerCase() + text.slice(1);
    }
    if (Math.random() < 0.2) {
      text = text.replace(/\.$/, '，关键是得值这个钱。');
    }
  }

  if (p.id === 'cognition') {
    if (Math.random() < 0.3 && !text.includes('不太懂')) {
      text = text.replace(/\.$/, '，不过有些地方我还不太懂。');
    }
  }

  if (p.id === 'decision') {
    if (Math.random() < 0.35 && !text.includes('合伙人')) {
      text = text.replace(/\.$/, '，不过还得跟合伙人商量一下。');
    }
  }

  if (p.id === 'silent') {
    if (text.length > 30 && Math.random() < 0.6) {
      const sentences = text.split(/[。！？]/).filter(s => s.trim());
      text = sentences[0] + '。';
    }
  }

  return text;
}

function getOpeningMessage(scenarioId, customerType) {
  const openings = OPENINGS[scenarioId]?.[customerType];
  if (!openings || openings.length === 0) return '你好，请开始吧。';
  return openings[Math.floor(Math.random() * openings.length)];
}

function getScenarioContext(scenarioId, customerType) {
  const s = SCENARIOS[scenarioId];
  const p = PERSONALITIES[customerType];
  if (!s || !p) return { title: '未知', persona: '', customerName: '客户', customerType: '', baseTrust: 25, baseIntent: 20 };

  const names = {
    'first-call': '张总', 'spin': '李总', 'objection': '王总',
    'closing': '赵总', 'followup': '陈总',
  };

  return {
    title: s.title,
    persona: s.context,
    customerName: names[scenarioId] || '客户',
    customerType: p.name,
    baseTrust: p.baseTrust,
    baseIntent: p.baseIntent,
  };
}

function calculateMetrics(msg, scenarioId, customerType, roundIndex, difficulty) {
  const analysis = analyzeMessage(msg);
  const p = PERSONALITIES[customerType];
  if (!p) return { trustDelta: 0, intentDelta: 0 };

  const state = new CustomerState(customerType, scenarioId, difficulty);
  const history = [];
  const result = state.processMessage(msg, analysis, roundIndex, history);

  return {
    trustDelta: result.trustDelta,
    intentDelta: result.intentDelta,
  };
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

// ── 评分主函数 ──
function scoreResponse(salesMsg, scenarioId, customerType, roundIndex, conversationHistory) {
  const criteria = SCORING_CRITERIA[scenarioId];
  if (!criteria) return { score: 50, feedback: '场景评分标准缺失', details: {} };

  const analysis = analyzeMessage(salesMsg);
  const personality = PERSONALITIES[customerType];
  const phase = getPhaseForRound(scenarioId, roundIndex);

  // ══ 5 维度评分 ══
  const professionalism = scoreProfessionalism(salesMsg, analysis, criteria, 20);
  const strategy = scoreStrategy(salesMsg, analysis, customerType, personality, roundIndex, phase, 25);
  const communication = scoreCommunication(salesMsg, analysis, criteria, 20);
  const structure = scoreStructure(salesMsg, analysis, criteria, roundIndex, 20);
  const progression = scoreProgression(salesMsg, analysis, roundIndex, phase, conversationHistory, 15);

  const totalScore = Math.round(professionalism + strategy + communication + structure + progression);

  // 生成反馈
  const feedback = generateFeedback(
    totalScore, professionalism, strategy, communication, structure, progression,
    analysis, criteria, personality, phase
  );

  return {
    score: clamp(totalScore, 0, 100),
    feedback,
    details: {
      professionalism: Math.round(professionalism),
      strategy: Math.round(strategy),
      communication: Math.round(communication),
      structure: Math.round(structure),
      progression: Math.round(progression),
    },
  };
}

// ══ 维度1：专业度 (20分) ══
function scoreProfessionalism(msg, analysis, criteria, maxPoints) {
  let score = maxPoints * 0.3; // 基础分

  // 关键词覆盖
  let kwMatched = 0;
  for (const kw of criteria.keywords) {
    if (msg.includes(kw)) kwMatched++;
  }
  const kwRatio = kwMatched / Math.min(criteria.keywords.length, 10);
  score += kwRatio * maxPoints * 0.35;

  // 专业性判断
  if (analysis.isProfessional) score += maxPoints * 0.15;
  if (analysis.isSpecific) score += maxPoints * 0.1;
  if (analysis.hasData) score += maxPoints * 0.1;

  // 扣分
  if (analysis.isRobotic) score -= maxPoints * 0.2;
  if (analysis.isTooShort) score -= maxPoints * 0.15;

  return clamp(score, 0, maxPoints);
}

// ══ 维度2：策略匹配 (25分) ══
function scoreStrategy(msg, analysis, customerType, personality, roundIndex, phase, maxPoints) {
  let score = maxPoints * 0.4;

  // 客户类型匹配
  switch (customerType) {
    case 'price':
      if (/性价比|投资回报|长期|划算|一次性.*终身|投入产出/i.test(msg)) score += maxPoints * 0.2;
      if (/便宜|降价|打折|优惠|砍价/i.test(msg) && !/价值|服务|质量|保障/i.test(msg)) score -= maxPoints * 0.12;
      if (analysis.hasValue && analysis.hasData) score += maxPoints * 0.1;
      break;
    case 'cognition':
      if (/简单|容易|比如|举例|打个比方|大白话|操作/i.test(msg)) score += maxPoints * 0.2;
      if (analysis.hasTechnical) score -= maxPoints * 0.12;
      if (analysis.hasStory || analysis.hasCase) score += maxPoints * 0.1;
      break;
    case 'decision':
      if (/方案|资料|对比|打印|合伙人|给他看|参考|说服/i.test(msg)) score += maxPoints * 0.2;
      if (/马上|立刻|赶紧|今天就|不用商量/i.test(msg)) score -= maxPoints * 0.15;
      if (analysis.hasNextStep && /资料|方案|文档/i.test(msg)) score += maxPoints * 0.1;
      break;
    case 'silent':
      if (/方便|简短|不打扰|有空|随时|你忙|不着急/i.test(msg)) score += maxPoints * 0.2;
      if (msg.length > 200) score -= maxPoints * 0.1;
      if (analysis.hasStory) score += maxPoints * 0.1;
      break;
  }

  // 阶段匹配
  if (phase) {
    switch (phase.name) {
      case '戒备':
        if (analysis.hasSelfIntro && analysis.hasGreeting) score += maxPoints * 0.08;
        if (analysis.isPushy) score -= maxPoints * 0.2;
        break;
      case '试探':
      case '现状探询':
        if (analysis.hasQuestion) score += maxPoints * 0.08;
        break;
      case '决定时刻':
        if (analysis.hasClose || analysis.hasGuarantee) score += maxPoints * 0.1;
        if (analysis.isDismissive) score -= maxPoints * 0.15;
        break;
    }
  }

  // 轮次策略
  if (roundIndex === 0 && !analysis.hasSelfIntro) score -= maxPoints * 0.1;
  if (roundIndex > 2 && !analysis.hasNextStep && !analysis.hasClose) score -= maxPoints * 0.05;

  // 负面策略
  if (analysis.isPushy) score -= maxPoints * 0.25;
  if (analysis.isDefensive) score -= maxPoints * 0.1;

  return clamp(score, 0, maxPoints);
}

// ═��� 维度3：沟通质量 (20分) ══
function scoreCommunication(msg, analysis, criteria, maxPoints) {
  let score = maxPoints * 0.35;

  // 加分项
  if (analysis.hasPolite) score += maxPoints * 0.12;
  if (analysis.hasEmpathy) score += maxPoints * 0.15;
  if (analysis.hasHumor) score += maxPoints * 0.08;
  if (analysis.isStructured) score += maxPoints * 0.1;
  if (analysis.hasQuestion) score += maxPoints * 0.08;
  if (analysis.hasStory) score += maxPoints * 0.07;

  // 扣分项
  if (analysis.isTooShort) score -= maxPoints * 0.25;
  if (analysis.isRobotic) score -= maxPoints * 0.2;
  if (analysis.isPushy) score -= maxPoints * 0.15;
  if (analysis.isDismissive) score -= maxPoints * 0.1;
  if (analysis.isDefensive) score -= maxPoints * 0.08;

  // 禁用词检查
  for (const word of criteria.forbidden) {
    if (msg.includes(word)) score -= maxPoints * 0.2;
  }

  return clamp(score, 0, maxPoints);
}

// ══ 维度4：结构完整性 (20分) ══
function scoreStructure(msg, analysis, criteria, roundIndex, maxPoints) {
  let score = 0;
  const elements = criteria.structure;
  const perElement = maxPoints / elements.length;

  const checks = {
    '自我介绍': /我是|我叫|我们公司|我们团队|跨洋狮|金讯博/i,
    '价值传递': /帮助|解决|提升|增长|获取|客户|询盘|独立站|价值|效果/i,
    '需求探询': /[？?]|什么|怎么|如何|能不能|目前|现在/i,
    '下一步约定': /加微信|发您|联系|明天|下次|沟通|约|聊/i,
    '现状确认': /目前|现在|当前|渠道|方式|在用什么/i,
    '难点挖掘': /困难|问题|挑战|困扰|痛点|怎么办|瓶颈/i,
    '影响放大': /如果|长期|持续|越来越|错过|损失|风险|影响/i,
    '方案引出': /方案|解决|帮助|建议|推荐|适合|可以这样/i,
    '顾虑认同': /理解|明白|确实|正常|担心|顾虑|你说得对/i,
    '价值说明': /价值|好处|收益|效果|回报|投资|优势/i,
    '证据支撑': /案例|数据|客户|同行|证明|结果|做过/i,
    '风险化解': /保障|合同|退款|售后|放心|保证|承诺/i,
    '行动引导': /下一步|确认|安排|开始|启动|做|定/i,
    '紧迫感营造': /时间|排期|名额|优惠|错过|等不了|限/i,
    '价值重申': /价值|效果|收益|投资|回报|划算|值/i,
    '异议消除': /理解|但是|其实|实际|案例|之前/i,
    '成交引导': /合同|付款|确认|定了|锁定|开始|下单/i,
    '后续铺垫': /服务|上线|运营|对接|后续|售后/i,
    '关系重建': /上次|之前|最近|好久|还好|记得/i,
    '新价值提供': /新|最近|刚|内容|资料|更新|案例/i,
    '状态探询': /怎么样|如何|考虑|想法|进展|觉得/i,
    '低门槛引导': /简单|方便|快速|不复杂|688|SaaS|先试/i,
    '时间锁定': /周几|哪天|具体|时间|确认|约/i,
  };

  for (const elem of elements) {
    if (checks[elem] && checks[elem].test(msg)) {
      score += perElement;
    }
  }

  // 结构化加分
  if (analysis.isStructured) score += maxPoints * 0.1;
  // 第一轮不需要完整结构
  if (roundIndex === 0) score = Math.min(score * 1.2, maxPoints);

  return clamp(score, 0, maxPoints);
}

// ══ 维度5：推进有效性 (15分) ══
function scoreProgression(msg, analysis, roundIndex, phase, history, maxPoints) {
  let score = maxPoints * 0.3;

  // 是否在推动对话前进
  if (analysis.hasNextStep) score += maxPoints * 0.25;
  if (analysis.hasClose && roundIndex >= 2) score += maxPoints * 0.2;
  if (analysis.hasQuestion) score += maxPoints * 0.15; // 提问 = 引导对话
  if (analysis.hasSolution) score += maxPoints * 0.15;
  if (analysis.hasGuarantee) score += maxPoints * 0.1;

  // 停滞信号
  if (analysis.isTooShort && roundIndex > 0) score -= maxPoints * 0.2;
  if (analysis.isDismissive) score -= maxPoints * 0.2;
  if (!analysis.hasQuestion && !analysis.hasNextStep && !analysis.hasClose && roundIndex > 1) {
    score -= maxPoints * 0.1; // 没有推进动作
  }

  return clamp(score, 0, maxPoints);
}

// ══ 反馈生成 ══
function generateFeedback(total, prof, strat, comm, struct, prog, analysis, criteria, personality, phase) {
  const parts = [];

  // 总体评价
  if (total >= 85) {
    parts.push('👍 非常出色！话术自然流畅，策略精准，客户体验极佳。');
  } else if (total >= 70) {
    parts.push('✅ 表现不错，基本合格。有几个细节可以再打磨一下。');
  } else if (total >= 55) {
    parts.push('⚠️ 中等水平，部分关键要素缺失或策略不够精准。');
  } else if (total >= 40) {
    parts.push('🔶 需要较大改进，话术存在明显短板。');
  } else {
    parts.push('❌ 表现不理想，建议重新审视策略和话术。');
  }

  // 各维度具体建议（按最差的维度优先）
  const dims = [
    { name: '专业度', score: prof, max: 20, tip: '💡 建议补充产品和公司关键信息，用数据支撑观点。' },
    { name: '策略匹配', score: strat, max: 25, tip: '🎯 建议针对' + (personality?.name || '客户') + '调整话术风格和内容重点。' },
    { name: '沟通质量', score: comm, max: 20, tip: '📝 建议增加共情表达，让语言更自然、更有人情味。' },
    { name: '结构完整', score: struct, max: 20, tip: '🔧 话术结构不够完整，建议补充缺失的沟通要素。' },
    { name: '推进有效', score: prog, max: 15, tip: '🚀 建议在结尾给出明确的下一步行动指引。' },
  ];

  dims.sort((a, b) => (a.score / a.max) - (b.score / b.max));

  // 只提示最差的2个维度
  for (const dim of dims.slice(0, 2)) {
    if (dim.score / dim.max < 0.6) {
      parts.push(dim.tip);
    }
  }

  // 特殊提醒
  if (analysis.isRobotic) {
    parts.push('🤖 你的话术听起来像在念稿子，请用更自然的口语化表达。');
  }
  if (analysis.isPushy) {
    parts.push('⚠️ 语气太急迫了！给客户施加过多压力会适得其反。');
  }
  if (analysis.isTooShort && total < 70) {
    parts.push('📏 回复过短，无法充分展示专业性和价值，建议展开说明。');
  }
  if (!analysis.hasQuestion && total < 75) {
    parts.push('💬 建议增加提问来引导对话，而不是单向输出信息。');
  }
  if (!analysis.hasEmpathy && total < 70) {
    parts.push('🤝 缺少共情表达，客户可能觉得你不理解他的处境。');
  }

  return parts.join('\n');
}

// ── 辅助函数 ──
function getPhaseForRound(scenarioId, roundIndex) {
  const s = SCENARIOS[scenarioId];
  if (!s?.phases) return null;
  for (const phase of s.phases) {
    if (phase.rounds.includes(roundIndex)) return phase;
  }
  return s.phases[s.phases.length - 1] || null;
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}

const customerStates = new Map();

function getCustomerState(examId, scenarioId, customerType, difficulty) {
  const key = examId + ':' + scenarioId;
  if (!customerStates.has(key)) {
    customerStates.set(key, new CustomerState(customerType, scenarioId, difficulty));
  }
  return customerStates.get(key);
}

function clearCustomerState(examId) {
  for (const key of customerStates.keys()) {
    if (key.startsWith(examId + ':')) customerStates.delete(key);
  }
}

function getRandomCustomerType() {
  const types = ['price', 'cognition', 'decision', 'silent'];
  return types[Math.floor(Math.random() * types.length)];
}

function getMaxRounds(scenarioId, difficulty) {
  const base = { 'first-call': 5, 'spin': 6, 'objection': 6, 'closing': 5, 'followup': 4 };
  const mod = { easy: 1, medium: 0, hard: -1 };
  return Math.max(3, (base[scenarioId] || 5) + (mod[difficulty] || 0));
}

async function apiExamStart(params) {
  const { traineeName, scenarios, difficulty } = params;

  await dataLayer.insertExam({

    started_at: now, status: 'in_progress'
  });

  const firstScenarioId = scenarios[0];

  await dataLayer.insertMessage({

  });

async function apiExamMessage(params) {
  const { examId, scenarioId, message, customerType, roundIndex } = params;
  const exam = await dataLayer.getExam(examId);
  if (!exam) throw new Error('考核不存在');

  const history = await dataLayer.getMessages(examId, scenarioId);

  const scoreResult = scoreResponse(message, scenarioId, customerType, roundIndex || 0, history);

  await dataLayer.insertMessage({
    exam_id: examId, scenario_id: scenarioId, round_index: roundIndex || 0, role: 'sales',
    content: message, score: scoreResult.score, feedback: scoreResult.feedback,
    score_details: JSON.stringify(scoreResult.details)
  });

  const state = getCustomerState(examId, scenarioId, customerType, exam.difficulty);
  const msgAnalysis = analyzeMessage(message);
  const stateResult = state.processMessage(message, msgAnalysis, roundIndex || 0, history);

  let customerMsg;
  try {
    const llmReply = await generateCustomerReplyLLM(message, {
      scenarioId, customerType, roundIndex: roundIndex || 0, historyMsgs: history, difficulty: exam.difficulty, state: null
    });
    customerMsg = llmReply || generateResponseRules(message, scenarioId, customerType, roundIndex || 0, history, exam.difficulty);
  } catch(e) {
    customerMsg = generateResponseRules(message, scenarioId, customerType, roundIndex || 0, history, exam.difficulty);
  }

  await dataLayer.insertMessage({
    exam_id: examId, scenario_id: scenarioId, round_index: (roundIndex || 0) + 1, role: 'customer', content: customerMsg
  });

  const maxRounds = getMaxRounds(scenarioId, exam.difficulty);
  const shouldEnd = (roundIndex || 0) + 1 >= maxRounds;

  await dataLayer.insertMetric({
    exam_id: examId, scenario_id: scenarioId, round_index: roundIndex || 0,
    trust_level: stateResult.trust, intent_level: stateResult.intent,
    trust_delta: stateResult.trustDelta, intent_delta: stateResult.intentDelta
  });

  return {
    customerMessage: customerMsg, score: scoreResult.score,
    feedback: scoreResult.feedback, details: scoreResult.details,
    roundIndex: (roundIndex || 0) + 1, maxRounds, scenarioComplete: shouldEnd,
    trust: stateResult.trust, intent: stateResult.intent,
    trustDelta: stateResult.trustDelta, intentDelta: stateResult.intentDelta,
  };
}

async function apiExamNextScenario(params) {
  const { examId, currentScenarioIndex } = params;
  const exam = await dataLayer.getExam(examId);
  const scenarios = JSON.parse(exam.scenarios);
  const nextIndex = (currentScenarioIndex || 0) + 1;
  if (nextIndex >= scenarios.length) return { allComplete: true };

  const nextScenarioId = scenarios[nextIndex];
  const customerType = getRandomCustomerType();
  const opening = getOpeningMessage(nextScenarioId, customerType);
  const context = getScenarioContext(nextScenarioId, customerType);

  await dataLayer.insertMessage({
    exam_id: examId, scenario_id: nextScenarioId, round_index: 0, role: 'customer', content: opening
  });
  await dataLayer.insertMetric({
    exam_id: examId, scenario_id: nextScenarioId, round_index: 0,
    trust_level: context.baseTrust, intent_level: context.baseIntent, trust_delta: 0, intent_delta: 0
  });

  const oldId = scenarios[currentScenarioIndex || 0];
  if (oldId) customerStates.delete(examId + ':' + oldId);

  return {
    scenarioId: nextScenarioId, customerType,
    customerName: context.customerName, scenarioTitle: context.title,
    scenarioPersona: context.persona, opening,
    scenarioIndex: nextIndex, totalScenarios: scenarios.length,
    trust: context.baseTrust, intent: context.baseIntent,
  };
}

async function finishExamLogic(examId, status) {
  const exam = await dataLayer.getExam(examId);
  if (!exam) throw new Error('考核不存在');
  const scenarios = JSON.parse(exam.scenarios);
  const scenarioResults = [];
  let totalScore = 0, totalMaxScore = 0;

  for (const sid of scenarios) {
    const msgs = await dataLayer.getSalesScores(examId, sid);
    const scores = msgs.map(m => m.score);
    const sTotal = scores.reduce((a,b) => a+b, 0);
    const sMax = scores.length * 100;
    const pct = sMax > 0 ? Math.round((sTotal / sMax) * 100) : 0;
    scenarioResults.push({ scenarioId: sid, totalScore: sTotal, maxScore: sMax, percentage: pct, rounds: scores.length });
    totalScore += sTotal; totalMaxScore += sMax;
  }

  const overallPct = totalMaxScore > 0 ? Math.round((totalScore / totalMaxScore) * 100) : 0;
  let grade;
  if (overallPct >= 90) grade = '优秀';
  else if (overallPct >= 75) grade = '良好';
  else if (overallPct >= 60) grade = '及格';
  else grade = '需加强';

  await dataLayer.updateExam(examId, {
    overall_score: overallPct, grade, finished_at: new Date().toISOString(), status
  });

  // 写入 scenario_scores 表，便于云端查询
  for (const sr of scenarioResults) {
    await dataLayer.insertScenarioScore({
      exam_id: examId, scenario_id: sr.scenarioId,
      total_score: sr.totalScore, max_score: sr.maxScore, percentage: sr.percentage
    });
  }

  clearCustomerState(examId);

  return {
    examId, traineeName: exam.trainee_name, difficulty: exam.difficulty,
    overallScore: overallPct, grade, scenarioResults,
    startedAt: exam.started_at, finishedAt: new Date().toISOString(),
    stopped: status === 'stopped',
  };
}

// ══ 规则引擎 Fallback ══
function generateResponseRules(salesMsg, scenarioId, customerType, roundIndex, historyMsgs, difficulty) {
  const p = PERSONALITIES[customerType];
// ── Fallback: 规则引擎 ──
  const analysis = analyzeMessage(salesMsg);
  const phase = getPhase(scenarioId, roundIndex);

  let moodCategory = 'neutral';

  if (analysis.isPushy) moodCategory = 'annoyed';
  else if (analysis.isRobotic) moodCategory = 'skeptical';
  else if (analysis.isTooShort && roundIndex > 0) moodCategory = 'annoyed';
  else if (analysis.hasEmpathy && analysis.isProfessional) moodCategory = 'positive';
  else if (analysis.hasStory || (analysis.hasCase && analysis.hasData)) moodCategory = 'positive';
  else if (analysis.hasValue && !analysis.isPushy) moodCategory = 'positive';
  else if (p.id === 'silent') moodCategory = 'cold';
  else if (roundIndex === 0 && !analysis.hasSelfIntro) moodCategory = 'skeptical';

  const strategy = selectStrategy(moodCategory, p, analysis, roundIndex, historyMsgs, phase);
  return buildResponse(strategy, p, analysis, phase, historyMsgs, difficulty);
}

function getPhase(scenarioId, roundIndex) {
  const s = SCENARIOS[scenarioId];
  if (!s) return { name: '对话中', description: '' };
  for (const phase of s.phases) {
    if (phase.rounds.includes(roundIndex)) return phase;
  }
  return s.phases[s.phases.length - 1] || { name: '对话中', description: '' };
}

function selectStrategy(mood, personality, analysis, roundIndex, history, phase) {
  const p = personality;

  if (roundIndex === 0) {
    return { type: 'opening', mood: 'neutral', priority: 'respond_to_sales' };
  }

  switch (mood) {
    case 'positive':
      return selectPositiveStrategy(p, analysis, phase, history);
    case 'skeptical':
      return selectSkepticalStrategy(p, analysis, phase);
    case 'annoyed':
      return selectAnnoyedStrategy(p, analysis, phase);
    case 'cold':
      return selectColdStrategy(p, analysis, phase);
    default:
      return selectNeutralStrategy(p, analysis, phase, history);
  }
}

function selectPositiveStrategy(p, analysis, phase) {
  const strategies = [];
  if (analysis.hasCase && !analysis.hasClose) {
    strategies.push({ type: 'ask_for_more_cases', weight: 4 });
  }
  if (analysis.hasSolution) {
    strategies.push({ type: 'ask_implementation_details', weight: 3 });
  }
  if (analysis.hasValue && !analysis.hasPrice) {
    strategies.push({ type: 'show_interest_in_value', weight: 3 });
  }
  if (analysis.hasNextStep) {
    strategies.push({ type: 'agree_to_next_step', weight: 4 });
  }
  if (analysis.hasClose && phase.name === '决定时刻') {
    strategies.push({ type: 'ready_to_close', weight: 5 });
  }
  if (analysis.hasEmpathy && analysis.isProfessional) {
    strategies.push({ type: 'express_appreciation', weight: 3 });
  }
  strategies.push({ type: 'warm_continuation', weight: 2 });
  return weightedPick(strategies);
}

function selectSkepticalStrategy(p, analysis, phase) {
  const strategies = [];
  if (analysis.hasPrice && !analysis.hasValue) {
    strategies.push({ type: 'challenge_price', weight: 5 });
  }
  if (analysis.hasTechnical) {
    strategies.push({ type: 'confused_by_tech', weight: 3 });
  }
  if (p.id === 'price' && !analysis.hasComparison) {
    strategies.push({ type: 'compare_with_cheaper', weight: 4 });
  }
  if (p.id === 'cognition' && !analysis.hasCase) {
    strategies.push({ type: 'doubt_effectiveness', weight: 4 });
  }
  if (p.id === 'decision' && !analysis.hasNextStep) {
    strategies.push({ type: 'mention_partner_block', weight: 4 });
  }
  strategies.push({ type: 'express_doubt', weight: 2 });
  return weightedPick(strategies);
}

function selectAnnoyedStrategy(p, analysis, phase) {
  return {
    type: 'push_back',
    sub: analysis.isPushy ? 'too_pushy' : analysis.isRobotic ? 'too_robotic' : 'general_annoyance',
  };
}

function selectColdStrategy(p, analysis, phase) {
  if (analysis.hasQuestion) return { type: 'brief_answer', weight: 1 };
  if (analysis.hasStory || analysis.hasCase) return { type: 'slight_interest', weight: 1 };
  return { type: 'minimal_ack', weight: 1 };
}

function selectNeutralStrategy(p, analysis, phase, history) {
  const strategies = [];
  if (analysis.hasQuestion && !analysis.hasSolution) {
    strategies.push({ type: 'waiting_for_answer', weight: 3 });
  }
  if (phase.name === '试探' || phase.name === '现状探询') {
    strategies.push({ type: 'share_current_situation', weight: 3 });
  }
  if (p.id === 'price') {
    strategies.push({ type: 'mention_budget_concern', weight: 2 });
  }
  strategies.push({ type: 'neutral_continuation', weight: 1 });
  return weightedPick(strategies);
}

function weightedPick(items) {
  const total = items.reduce((s, i) => s + (i.weight || 1), 0);
  let rand = Math.random() * total;
  for (const item of items) {
    rand -= (item.weight || 1);
    if (rand <= 0) return item;
  }
  return items[0];
}

function buildResponse(strategy, p, analysis, phase, history, difficulty) {
  const candidates = getCandidates(strategy, p, analysis, phase, difficulty);
  const historyTexts = new Set(history.map(h => h.content));
  const fresh = candidates.filter(c => !historyTexts.has(c));
  const pool = fresh.length > 0 ? fresh : candidates;
  const response = pool[Math.floor(Math.random() * pool.length)];
  return postProcess(response, p, analysis);
}

function postProcess(response, p, analysis) {
  let text = response;

  if (p.id === 'price') {
    if (Math.random() < 0.3 && !text.startsWith('说实话')) {
      text = '说实话，' + text.charAt(0).toLowerCase() + text.slice(1);
    }
    if (Math.random() < 0.2) {
      text = text.replace(/\.$/, '，关键是得值这个钱。');
    }
  }

  if (p.id === 'cognition') {
    if (Math.random() < 0.3 && !text.includes('不太懂')) {
      text = text.replace(/\.$/, '，不过有些地方我还不太懂。');
    }
  }

  if (p.id === 'decision') {
    if (Math.random() < 0.35 && !text.includes('合伙人')) {
      text = text.replace(/\.$/, '，不过还得跟合伙人商量一下。');
    }
  }

  if (p.id === 'silent') {
    if (text.length > 30 && Math.random() < 0.6) {
      const sentences = text.split(/[。！？]/).filter(s => s.trim());
      text = sentences[0] + '。';
    }
  }

  return text;
}

function getOpeningMessage(scenarioId, customerType) {
  const openings = OPENINGS[scenarioId]?.[customerType];
  if (!openings || openings.length === 0) return '你好，请开始吧。';
  return openings[Math.floor(Math.random() * openings.length)];
}

function getScenarioContext(scenarioId, customerType) {
  const s = SCENARIOS[scenarioId];
  const p = PERSONALITIES[customerType];
  if (!s || !p) return { title: '未知', persona: '', customerName: '客户', customerType: '', baseTrust: 25, baseIntent: 20 };

  const names = {
    'first-call': '张总', 'spin': '李总', 'objection': '王总',
    'closing': '赵总', 'followup': '陈总',
  };

  return {
    title: s.title,
    persona: s.context,
    customerName: names[scenarioId] || '客户',
    customerType: p.name,
    baseTrust: p.baseTrust,
    baseIntent: p.baseIntent,
  };
}

function calculateMetrics(msg, scenarioId, customerType, roundIndex, difficulty) {
  const analysis = analyzeMessage(msg);
  const p = PERSONALITIES[customerType];
  if (!p) return { trustDelta: 0, intentDelta: 0 };

  const state = new CustomerState(customerType, scenarioId, difficulty);
  const history = [];
  const result = state.processMessage(msg, analysis, roundIndex, history);

  return {
    trustDelta: result.trustDelta,
    intentDelta: result.intentDelta,
  };
}

function clamp(val, min, max) {
  return Math.max(min, Math.min(max, val));
}
