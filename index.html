async function handleLoginClick() {
  const username = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { toast('请输入用户名和密码'); return; }

  try {
    if (loginMode === 'admin') {
      // 尝试登录管理员
      try {
        await login(username, password);
      } catch (loginErr) {
        // 登录失败，尝试注册首个管理员（如果还没有管理员）
        const name = document.getElementById('adminName').value.trim() || username;
        const db = await loadGistData();
        if (!db.users.find(u => u.role === 'admin')) {
          db.users.push({ id: username, password, displayName: name, role: 'admin' });
          await saveGistData(db);
          currentUser = { id: username, role: 'admin', displayName: name };
          cloudMode = true;
        } else {
          throw new Error('用户名或密码错误，或已有管理员');
        }
      }
      if (!currentUser || currentUser.role !== 'admin') {
        toast('该账号不是管理员');
        await logout();
        return;
      }
    } else {
      await login(username, password);
    }
    applyAuthUI();
    toast('登录成功');
  } catch (e) {
    toast('登录失败: ' + e.message);
  }
}

async function handleSetupAdminClick() {
  const username = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const name = document.getElementById('adminName').value.trim() || username;
  if (!username || !password) { toast('请输入用户名和密码'); return; }
  try {
    const db = await loadGistData();
    if (db.users.find(u => u.id === username)) { toast('账号已存在'); return; }
    db.users.push({ id: username, password, displayName: name, role: 'admin' });

    currentUser = { id: username, role: 'admin', displayName: name };
    cloudMode = true;
    applyAuthUI();
    toast('管理员注册成功');
  } catch (e) {
    toast('注册失败: ' + e.message);
  }
}

async function startExam(){

  if(scenarios.length===0){toast('请选择场景');return;}
  state.difficulty=document.getElementById('difficulty').value;

  try{
    const d=await apiExamStart({traineeName:name,scenarios,difficulty:state.difficulty});
    state.examId=d.examId; state.currentScenarioId=d.currentScenario; state.customerType=d.customerType;
    state.trust=d.trust||25; state.intent=d.intent||20;
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('examScreen').classList.add('active');
    document.getElementById('reportOverlay').classList.remove('active');

    updateMetrics(state.trust,state.intent,0,0);

function updateMetrics(trust,intent,tDelta,iDelta){
  document.getElementById('trustValue').textContent=trust;

  document.getElementById('intentBar').style.width=intent+'%';

  td.textContent=tDelta!==0?(tDelta>0?'↑+'+tDelta:'↓'+tDelta):'';
  td.className='m-delta '+(tDelta>=0?'delta-up':'delta-down');
  const id=document.getElementById('intentDelta');
  id.textContent=iDelta!==0?(iDelta>0?'↑+'+iDelta:'↓'+iDelta):'';
  id.className='m-delta '+(iDelta>=0?'delta-up':'delta-down');
  // Color-code trust bar
  const tBar=document.getElementById('trustBar');
  if(trust>=70)tBar.style.background='#10B981';else if(trust>=40)tBar.style.background='#3B82F6';else tBar.style.background='#EF4444';
  const iBar=document.getElementById('intentBar');
  if(intent>=70)iBar.style.background='#10B981';else if(intent>=40)iBar.style.background='#8B5CF6';else iBar.style.background='#F59E0B';
}

function addCustomer(t){appendMsg('customer',t);}
function addSales(t,s){appendMsg('sales',t,s);}

function appendMsg(role,text,score,type){
  const el=document.getElementById('chatMessages');
  const div=document.createElement('div');
  div.className='message '+role+(type?' '+type:'');
  let extra='';
  if(role==='sales'&&score!==undefined){

function handleKeyDown(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

async function sendMessage(){
  if(state.isTyping||!state.active)return;
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text)return;
  input.value=''; input.style.height='auto';
  addSales(text); state.scores.push(null);
  try{
    const d=await apiExamMessage({examId:state.examId,scenarioId:state.currentScenarioId,message:text,customerType:state.customerType,roundIndex:state.roundIndex});
    // Update score tag on last sales message
    const salesMsgs=document.querySelectorAll('#chatMessages .message.sales');
    const last=salesMsgs[salesMsgs.length-1];
    if(last&&d.score!==undefined){
      const tag=last.querySelector('.score-tag');
      if(tag){const cls=d.score>=75?'score-high':d.score>=55?'score-mid':'score-low';tag.textContent='评分:'+d.score;tag.className='score-tag '+cls;}
    }
    state.scores[state.scores.length-1]=d.score;
    state.roundIndex=d.roundIndex;
    document.getElementById('roundCount').textContent=state.roundIndex;
    document.getElementById('liveScore').textContent=d.score;
    // Update trust/intent
    if(d.trust!==undefined){
      state.trust=d.trust; state.intent=d.intent;
      updateMetrics(d.trust,d.intent,d.trustDelta||0,d.intentDelta||0);
    }
    if(d.feedback)addSys(d.feedback,d.score>=70?'feedback':'warning');
    if(d.scenarioComplete){
      showTyping(()=>{
        addCustomer(d.customerMessage);
        addSys('✅ 当前场景完成！','feedback');
        const avg=state.scores.filter(s=>s!==null).reduce((a,b)=>a+b,0)/state.scores.filter(s=>s!==null).length||0;
        addSys('📊 本轮均分：'+Math.round(avg),avg>=70?'feedback':'warning');
        setTimeout(async()=>{
          try{
    const nd=await apiExamNextScenario({examId:state.examId,currentScenarioIndex:state.scenarioIndex});
            if(nd.allComplete){finishExam();}
            else{
              state.scenarioIndex=nd.scenarioIndex; state.currentScenarioId=nd.scenarioId;
              state.customerType=nd.customerType; state.roundIndex=0; state.scores=[];
              state.trust=nd.trust||25; state.intent=nd.intent||20;
              updateSidebar(nd); updateMetrics(state.trust,state.intent,0,0);
              addSys('🔄 进入下一个场景...','system');
              document.getElementById('chatMessages').innerHTML='';
              addSys('📋 '+nd.scenarioTitle+' | '+nd.customerName);
              addSys('💡 '+nd.scenarioPersona);
              addSys('👤 '+nd.customerName+' | '+TYPE_INFO[nd.customerType].name);
              setTimeout(()=>addCustomer(nd.opening),500);
              document.getElementById('userInput').focus();
            }
          }catch(e){toast('切换失败: '+e.message);}
        },1500);
      },1000);
    }else{
      showTyping(()=>{addCustomer(d.customerMessage);document.getElementById('userInput').focus();},800+Math.random()*1200);
    }
  }catch(e){addSys('❌ 网络错误: '+e.message,'warning');}
}

      <div class="big-num">${d.overallScore}</div>
      <div style="font-size:16px;color:var(--text-secondary)">综合评分</div>
      <span class="grade-badge ${gc}">${d.grade}</span>
    </div>
    <h3 style="margin-bottom:8px;color:var(--primary);font-size:15px">📈 各场景得分</h3>
    <div class="dim-scores">
      ${(d.scenarioResults||[]).map(sr=>{

          <div class="dim-name">${s?s.name:sr.scenarioId} (${sr.rounds||0}轮)</div>
          <div class="dim-score">${sr.percentage}分</div>
          <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${sr.percentage}%;background:${sr.percentage>=80?'var(--success)':sr.percentage>=60?'var(--warning)':'var(--danger)'}"></div></div>
        </div>`;
      }).join('')}
    </div>
    ${d.lastDetails?`
    <h3 style="margin-bottom:8px;color:var(--primary);font-size:15px;margin-top:16px">🔍 最后一轮5维评分</h3>
    <div class="dim-scores">
      ${[
        {k:'professionalism',n:'🎓 专业度',m:20},
        {k:'strategy',n:'🎯 策略匹配',m:25},
        {k:'communication',n:'💬 沟通质量',m:20},
        {k:'structure',n:'📐 结构完整',m:20},
        {k:'progression',n:'🚀 推进有效',m:15}
      ].map(dim=>{
        const v=d.lastDetails[dim.k]||0;
        const pct=Math.round(v/dim.m*100);
        return `<div class="dim-item">
          <div class="dim-name">${dim.n}</div>
          <div class="dim-score">${v}/${dim.m}分</div>
          <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${pct}%;background:${pct>=80?'var(--success)':pct>=60?'var(--warning)':'var(--danger)'}"></div></div>
        </div>`;
      }).join('')}
    </div>`:''}
    ${(d.goodFeedback||[]).length?`<div class="feedback-section"><h3>✅ 表现亮点</h3>${d.goodFeedback.map(f=>`<div class="feedback-item feedback-good"><span>👍</span><span>${esc(f.text).replace(/\n/g,'<br>')}</span></div>`).join('')}</div>`:''}
    ${(d.improveFeedback||[]).length?`<div class="feedback-section"><h3>🔧 需要改进</h3>${d.improveFeedback.map(f=>`<div class="feedback-item feedback-improve"><span>💡</span><span>${esc(f.text).replace(/\n/g,'<br>')}</span></div>`).join('')}</div>`:''}
    <div class="btn-row">
      <button class="btn-outline" onclick="retakeExam()">🔄 重新考核</button>
      <button class="btn btn-primary" onclick="showDetailedReport('${d.examId}')">📄 查看详细报告</button>
      <button class="btn btn-primary" onclick="closeReport()">✅ 确认</button>
    </div>
  `;
  document.getElementById('reportOverlay').classList.add('active');
}

async function showDetailedReport(examId){
  closeReport();
  try{
    const exam = await dataLayer.getExam(examId);
    if(!exam){toast('未找到考核记录');return;}
    const allMessages = await dataLayer.getMessages(examId, null);
    const salesMessages = allMessages.filter(m=>m.role==='sales' && m.score !== null && m.score !== undefined);
    const scenarioScores = await dataLayer.getScenarioScores(examId);

    // 计算各维度平均分
    const dimTotals = { professionalism:0, strategy:0, communication:0, structure:0, progression:0 };
    let dimCount = 0;
    for(const m of allMessages){
      if(m.role==='sales' && m.score_details){
        try{
          const det = typeof m.score_details === 'string' ? JSON.parse(m.score_details) : m.score_details;
          for(const k in dimTotals) if(det[k]) { dimTotals[k] += det[k]; }
          dimCount++;
        }catch(e){}
      }
    }

    // 按场景聚合
    const byScenario = {};
    for(const m of allMessages){
      if(!byScenario[m.scenario_id]) byScenario[m.scenario_id] = [];
      byScenario[m.scenario_id].push(m);
    }

    // 生成评价
    const avgScore = salesMessages.length ? Math.round(salesMessages.reduce((a,m)=>a+m.score,0)/salesMessages.length) : 0;
    let overallComment = '';
    if(avgScore>=85) overallComment = '你的整体表现非常出色，话术专业、逻辑清晰，已经具备独立接待客户的能力。';
    else if(avgScore>=70) overallComment = '你的表现良好，基本掌握了销售话术的核心要点，仍有少量细节可以打磨。';
    else if(avgScore>=60) overallComment = '你具备了一定的基础，但在专业度、策略匹配或推进能力上还需要加强训练。';
    else overallComment = '本次考核暴露出较多问题，建议重新学习SOP话术，多进行模拟练习。';

    // 收集亮点与改进点
    const goodPoints = [], improvePoints = [];
    for(const m of salesMessages){
      if(m.score >= 75) goodPoints.push({text:m.content, score:m.score, feedback:m.feedback});
      else if(m.score < 60) improvePoints.push({text:m.content, score:m.score, feedback:m.feedback});
    }

    const html = `
      <h2>📄 考生详细报告</h2>
      <p style="text-align:center;color:var(--text-secondary);font-size:13px">考生：${esc(exam.trainee_name)} | 综合：${exam.overall_score??'-'}分 | 等级：${exam.grade??'-'}</p>

      <div class="feedback-section"><h3>📝 总体评价</h3>
        <div class="feedback-item feedback-good"><span>🎯</span><span>${overallComment}</span></div>
      </div>

      <h3 style="margin-bottom:8px;color:var(--primary);font-size:15px;margin-top:16px">📈 各场景表现</h3>
      <div class="dim-scores">
        ${scenarioScores.map(ss=>{
          const s = EXAM_SCENARIOS.find(sc=>sc.id===ss.scenario_id);
          return `<div class="dim-item">
            <div class="dim-name">${s?s.name:ss.scenario_id}</div>
            <div class="dim-score">${ss.percentage}分 (${ss.total_score}/${ss.max_score})</div>
            <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${ss.percentage}%;background:${ss.percentage>=80?'var(--success)':ss.percentage>=60?'var(--warning)':'var(--danger)'}"></div></div>
          </div>`;
        }).join('')}
      </div>

      ${goodPoints.length?`<div class="feedback-section"><h3>✅ 表现亮点</h3>${goodPoints.map(p=>`<div class="feedback-item feedback-good"><span>👍</span><span><b>${p.score}分</b>：${esc(p.text)}<br><i style="color:var(--text-secondary)">${esc(p.feedback||'')}</i></span></div>`).join('')}</div>`:''}

      ${improvePoints.length?`<div class="feedback-section"><h3>🔧 需要改进</h3>${improvePoints.map(p=>`<div class="feedback-item feedback-improve"><span>💡</span><span><b>${p.score}分</b>：${esc(p.text)}<br><i style="color:var(--text-secondary)">${esc(p.feedback||'')}</i></span></div>`).join('')}</div>`:''}

      <div class="feedback-section"><h3>📚 改进建议</h3>
        ${avgScore<70?`<div class="feedback-item feedback-improve"><span>📖</span><span>建议重点复习「异议处理」和「SPIN挖需」话术，提升客户信任度。</span></div>`:''}
        ${avgScore<85?`<div class="feedback-item feedback-improve"><span>🎧</span><span>多倾听客户需求，避免一开始就直接报价或过度推销。</span></div>`:''}
        <div class="feedback-item feedback-good"><span>🔄</span><span>建议每天进行1-2轮模拟考核，持续优化开场白和逼单话术。</span></div>
      </div>

      <h3 style="margin-bottom:8px;color:var(--primary);font-size:15px;margin-top:16px">💬 完整对话回顾</h3>
      <div class="chat-transcript" style="max-height:400px;">
        ${allMessages.map(m=>{
          const cls=m.role==='sales'?'sales':'customer';
          const rl=m.role==='sales'?'🧑‍💼 销售':'👤 客户';
          const si=m.score!==null&&m.score!==undefined?` | 评分:${m.score}`:'';
          return `<div class="transcript-msg ${cls}">
            <div class="role">${rl} (${m.scenario_id}, 轮${m.round_index})${si}</div>
            <div class="text">${esc(m.content)}</div>
            ${m.feedback?`<div class="score-info">💬 ${esc(m.feedback)}</div>`:''}
          </div>`;
        }).join('')}
      </div>

      <div class="btn-row">
        <button class="btn-outline" onclick="retakeExam()">🔄 重新考核</button>
        <button class="btn btn-primary" onclick="closeDetailedReport()">✅ 关闭</button>
      </div>
    `;
    document.getElementById('detailedReportCard').innerHTML = html;
    document.getElementById('detailedReportOverlay').classList.add('active');
  }catch(e){
    console.error('加载详细报告失败:', e);
    toast('加载详细报告失败: '+e.message);
  }
}

          <div><label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px;">考生姓名</label>
            <input type="text" id="newExamineeName" placeholder="姓名" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;"></div>
          <div><label style="font-size:12px;color:var(--text-secondary);display:block;margin-bottom:4px;">登录密码</label>
            <input type="text" id="newExamineePwd" placeholder="留空自动生成" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;"></div>
          <div style="display:flex;align-items:flex-end;"><button class="btn btn-primary btn-sm" onclick="handleCreateExaminee()" style="width:100%;">➕ 创建</button></div>
        </div>
        <div id="newAccountResult" style="margin-top:8px;font-size:12px;color:var(--text-secondary);"></div>
      </div>
    ` : '';

    document.getElementById('examTable').innerHTML= createAccountHtml + `
      <table><thead><tr><th>考生</th><th>难度</th><th>场景</th><th>总分</th><th>等级</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
      <tbody>${e.exams.map(ex=>`
        <tr>
          <td class="clickable" onclick="viewDetail('${ex.id}')">${esc(ex.trainee_name)}</td>
          <td>${ex.difficulty==='easy'?'初级':ex.difficulty==='medium'?'中级':'高级'}</td>
          <td>${JSON.parse(ex.scenarios).length}</td>
          <td>${ex.overall_score??'-'}</td>
          <td>${ex.grade?(gi[ex.grade]||'')+ex.grade:'-'}</td>
          <td>${ex.status==='completed'?'✅':ex.status==='stopped'?'⏹':'🔄'}</td>
          <td>${new Date(ex.started_at).toLocaleString('zh-CN')}</td>
          <td>
            <button class="btn btn-outline btn-sm" onclick="viewDetail('${ex.id}')">查看</button>
            <button class="btn btn-danger btn-sm" onclick="deleteExam('${ex.id}')">删除</button>
          </td>
        </tr>`).join('')}</tbody></table>
      ${e.exams.length===0?'<div style="padding:32px;text-align:center;color:var(--text-secondary)">暂无记录</div>':''}`;
  }catch(e){document.getElementById('examTable').innerHTML='<div style="padding:32px;text-align:center;color:var(--danger)">加载失败: '+e.message+'</div>';}
}

async function handleCreateExaminee() {
  const id = document.getElementById('newExamineeEmail').value.trim();
  const name = document.getElementById('newExamineeName').value.trim();
  let password = document.getElementById('newExamineePwd').value.trim();
  if (!id || !name) { toast('请输入用户名和姓名'); return; }
  if (!password) password = generateTempPassword();
  try {
    const result = await createUser(id, password, name, 'examinee');
    document.getElementById('newAccountResult').innerHTML =
      '✅ 已创建：用户名 <b>' + esc(result.id) + '</b> | 密码：<b>' + esc(result.password) + '</b>（请复制保存）';
    document.getElementById('newExamineeEmail').value = '';
    document.getElementById('newExamineeName').value = '';
    document.getElementById('newExamineePwd').value = '';
  } catch (e) {
    toast('创建失败: ' + e.message);
  }
}

// ═══════════════════ TOAST ═══════════════════
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

async function loadLlmStatus(){
  try{
    const d=getLlmConfig();
    const badge=document.getElementById('aiModeBadge');
    if(d.enabled){
      badge.textContent='🤖 AI驱动 ('+d.provider+')';
      badge.style.background='rgba(16,185,129,0.3)';
    }else{
      badge.textContent='📋 规则模式';
      badge.style.background='rgba(255,255,255,0.2)';
    }
    // 填充配置面板
    const pp=document.getElementById('llmProvider');
    if(pp) pp.value=d.provider||'';
    const ak=document.getElementById('llmApiKey');
    if(ak) ak.placeholder=d.hasKey?'已配置 (●●●●)':'sk-...';
    const md=document.getElementById('llmModel');
    if(md) md.value=d.model||'';
  }catch(e){}
}

async function updateLlmConfig(){
  const provider=document.getElementById('llmProvider').value;
  const apiKey=document.getElementById('llmApiKey').value;
  const model=document.getElementById('llmModel').value;
  const body={};
  if(provider!==undefined)body.provider=provider;
  if(apiKey)body.apiKey=apiKey;
  if(model)body.model=model;
  try{
    const cfg = await updateLlmConfigBrowser(body);
    const st=document.getElementById('llmStatus');
    st.innerHTML='✅ 配置已保存 | Provider: <b>'+cfg.provider+'</b> | Model: <b>'+cfg.model+'</b> | 状态: '+(cfg.enabled?'🟢 AI已激活':'🟡 缺少API Key');
    document.getElementById('llmApiKey').value='';
    document.getElementById('llmApiKey').placeholder='已保存 (●●●●)';
    loadLlmStatus();
  }catch(e){
    document.getElementById('llmStatus').innerHTML='❌ 保存失败: ' + e.message;
  }
}
